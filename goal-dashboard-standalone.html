<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <!--
    De app laadt niets van buiten en praat alleen met je eigen Supabase-project.
    Dat leggen we hier vast, zodat de browser vreemde scripts weigert en er ook
    bij een fout in de code geen gegevens naar een ander adres kunnen.
    'unsafe-inline' bij style is nodig voor de style="width:..%"-attributen in
    de balken. Gebruik je een eigen domein voor Supabase, vul dat dan aan bij
    connect-src.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co https://*.supabase.in; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Dagelijks, wekelijks en maandelijks overzicht van je sport- en voedingsdoelen, met een gekleurd percentage van donkerrood naar donkergroen.">
  <meta name="theme-color" content="#11141a">
  <title>Goal Dashboard — sport &amp; voeding</title>
  <style>
/* Goal Dashboard - stijl */

:root {
  --bg: #0e1117;
  --bg-elev: #161b24;
  --card: #171d27;
  --card-2: #1d2531;
  --border: #262f3d;
  --text: #e7ecf5;
  --muted: #8e9bb0;
  --accent: #4c8dff;
  --track: #232c3a;
  --danger: #b3261e;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .25);
  --radius: 14px;
  --maxw: 940px;
}

html[data-theme="light"] {
  --bg: #f3f5f9;
  --bg-elev: #ffffff;
  --card: #ffffff;
  --card-2: #f1f4f9;
  --border: #dde3ec;
  --text: #16202e;
  --muted: #63708a;
  --accent: #2563eb;
  --track: #e3e8f0;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px rgba(16, 24, 40, .08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

h1, h2, h3 { margin: 0; font-weight: 650; letter-spacing: -.01em; }
h1 { font-size: 1.15rem; }
h2 { font-size: .95rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
p { margin: 0; }

/* ------------------------------- topbar ------------------------------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding-top: env(safe-area-inset-top);
}

.topbar-inner,
.tabs,
.period-nav,
.view,
.footer {
  max-width: var(--maxw);
  margin: 0 auto;
  padding-left: 16px;
  padding-right: 16px;
}

.topbar-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-top: 12px;
  padding-bottom: 4px;
}

.topbar-actions { display: flex; align-items: center; gap: 6px; }

#btn-sync { font-size: 1.15rem; }
#btn-sync:disabled { cursor: progress; opacity: .8; }
.btn-sync-bezig { animation: draai 1s linear infinite; }

@keyframes draai {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@media (prefers-reduced-motion: reduce) {
  .btn-sync-bezig { animation: none; opacity: .6; }
}

.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { font-size: 1.5rem; }
.brand-sub { font-size: .78rem; color: var(--muted); }

.tabs { display: flex; gap: 4px; padding-top: 8px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }

.tab {
  flex: 0 0 auto;
  appearance: none;
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  color: var(--muted);
  font: inherit;
  font-weight: 550;
  padding: 8px 12px 10px;
  cursor: pointer;
  white-space: nowrap;
}
.tab:hover { color: var(--text); }
.tab-active { color: var(--text); border-bottom-color: var(--accent); }

.period-nav {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-top: 10px;
  padding-bottom: 10px;
  border-top: 1px solid var(--border);
  margin-top: -1px;
}
.period-label { flex: 1; font-weight: 600; font-size: .95rem; text-align: center; }

/* -------------------------------- knoppen ----------------------------- */

.btn {
  appearance: none;
  font: inherit;
  font-weight: 550;
  color: var(--text);
  background: var(--card-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px 14px;
  cursor: pointer;
  transition: background .15s, border-color .15s, transform .05s;
}
.btn:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
.btn:active { transform: translateY(1px); }
.btn-sm { padding: 6px 10px; font-size: .85rem; }
.btn-icon { padding: 6px 12px; font-size: 1.1rem; line-height: 1.2; }
.btn-ghost { background: transparent; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-danger { background: transparent; color: #ef6a63; border-color: color-mix(in srgb, var(--danger) 50%, var(--border)); }
.btn-danger:hover { background: color-mix(in srgb, var(--danger) 18%, transparent); }
.btn[hidden] { display: none; }

/* -------------------------------- layout ------------------------------ */

.view {
  padding-top: 16px;
  padding-bottom: 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}

.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.card-head h2 { margin: 0; }
.card > h2 { margin-bottom: 12px; }
.card-foot { margin-top: 12px; display: flex; justify-content: flex-end; }

.hint { color: var(--muted); font-size: .84rem; margin-top: 10px; }
.empty { color: var(--muted); font-size: .9rem; padding: 12px 0; }

.footer { padding-bottom: calc(24px + env(safe-area-inset-bottom)); color: var(--muted); font-size: .8rem; }

/* --------------------------------- hero ------------------------------- */

.hero { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
.hero-ring { flex: 0 0 auto; }
.hero-info { flex: 1 1 240px; min-width: 220px; }
.hero-label { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; }
.hero-sub { color: var(--muted); font-size: .92rem; margin-top: 4px; }
.hero-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }

.trend { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.trend-ring { flex: 0 0 auto; }
.trend-info { flex: 1 1 220px; min-width: 200px; }
.trend-delta { font-size: 1.9rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }

.ring { display: block; }
.ring-pct { font-weight: 700; letter-spacing: -.03em; }
.ring-pct-sign { font-size: .5em; }

.legend { display: flex; align-items: center; gap: 8px; margin-top: 14px; color: var(--muted); font-size: .72rem; }
.legend-bar { flex: 1; height: 8px; border-radius: 999px; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--card-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 2px 9px;
  font-size: .75rem;
  font-weight: 600;
  color: var(--muted);
  white-space: nowrap;
}
.chip-off { opacity: .7; }

/* -------------------------------- stats ------------------------------- */

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
}
.stat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
}
.stat-label { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; }
.stat-value { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; }
.stat-value .unit { font-size: .8rem; font-weight: 600; color: var(--muted); margin-left: 3px; }
.stat-sub { color: var(--muted); font-size: .78rem; }

/* ---------------------------- meetwaarden ----------------------------- */

.measure-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.measure { display: flex; flex-direction: column; gap: 6px; }
.measure-label { font-size: .82rem; color: var(--muted); font-weight: 600; }
.measure-input { position: relative; display: flex; align-items: center; }
.measure-unit {
  position: absolute; right: 12px; color: var(--muted); font-size: .82rem; pointer-events: none;
}

input[type="number"], input[type="text"], select, textarea {
  width: 100%;
  font: inherit;
  color: var(--text);
  background: var(--card-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  outline: none;
}
input[type="number"] { padding-right: 46px; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; padding-right: 12px; }

/* -------------------------------- doelen ------------------------------ */

.goals { display: flex; flex-direction: column; gap: 14px; }
.goal-dim { opacity: .55; }
.goal-off { opacity: .4; }
.goal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 7px; }
.goal-name { font-weight: 600; font-size: .95rem; display: flex; align-items: center; gap: 8px; }
.goal-icon { font-size: 1.05rem; }

.segmented { display: flex; gap: 6px; flex-wrap: wrap; }
.seg {
  flex: 1 1 0;
  min-width: 92px;
  appearance: none;
  font: inherit;
  font-size: .88rem;
  font-weight: 550;
  color: var(--muted);
  background: var(--card-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 8px;
  cursor: pointer;
  position: relative;
  transition: background .15s, color .15s, border-color .15s;
}
.seg:hover:not(:disabled) { color: var(--text); }
.seg:disabled { cursor: not-allowed; }
.seg-active {
  background: var(--seg-color, var(--accent));
  border-color: var(--seg-color, var(--accent));
  color: #fff;
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--seg-color, var(--accent)) 40%, transparent);
}
.auto-dot {
  display: block;
  font-size: .62rem;
  text-transform: uppercase;
  letter-spacing: .08em;
  opacity: .85;
}

/* -------------------------------- teller ------------------------------ */

.meter-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.meter-amount { font-size: 1.9rem; font-weight: 700; letter-spacing: -.02em; }
.meter-goal { color: var(--muted); font-size: .88rem; flex: 1; }
.meter-pct { font-size: 1.1rem; font-weight: 700; }

.meter-buttons { display: flex; gap: 8px; margin-top: 14px; }
.btn-add {
  flex: 1;
  padding: 16px 8px;
  font-size: 1rem;
  font-weight: 650;
  background: color-mix(in srgb, var(--accent) 16%, var(--card-2));
  border-color: color-mix(in srgb, var(--accent) 40%, var(--border));
}
.btn-add:hover { background: color-mix(in srgb, var(--accent) 28%, var(--card-2)); }

.meter-tweak { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.meter-manual { position: relative; display: flex; align-items: center; width: 110px; }
.meter-manual input { padding: 6px 34px 6px 10px; font-size: .85rem; }
.meter-manual .measure-unit { right: 10px; font-size: .75rem; }

/* ------------------------------ breakdown ----------------------------- */

.breakdown { display: flex; flex-direction: column; gap: 10px; }
.bd-row {
  display: grid;
  grid-template-columns: minmax(150px, 1.3fr) minmax(80px, 2fr) 48px;
  grid-template-areas: "name bar pct" "counts counts counts";
  align-items: center;
  gap: 6px 10px;
}
.bd-name { grid-area: name; display: flex; align-items: center; gap: 7px; font-size: .9rem; font-weight: 550; }
.bd-bar { grid-area: bar; }
.bd-pct { grid-area: pct; text-align: right; font-weight: 700; font-size: .9rem; }
.bd-counts { grid-area: counts; color: var(--muted); font-size: .75rem; }
.bd-off { opacity: .45; }
.bd-icon { font-size: 1rem; }

.bar { height: 10px; background: var(--track); border-radius: 999px; overflow: hidden; }
.bar-fill { display: block; height: 100%; border-radius: 999px; transition: width .3s ease; }

/* ------------------------------- daybars ------------------------------ */

.daybars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.daybar {
  appearance: none;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}
.daybar-track {
  width: 100%;
  height: 110px;
  background: var(--track);
  border-radius: 8px;
  display: flex;
  align-items: flex-end;
  overflow: hidden;
}
.daybar-fill { width: 100%; border-radius: 8px 8px 0 0; transition: height .3s ease; }
.daybar-label { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; }
.daybar-val { font-size: .82rem; font-weight: 700; }
.daybar:hover .daybar-track { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ------------------------------ kalender ------------------------------ */

.calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal-head { text-align: center; color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; padding-bottom: 4px; }
.cal-cell {
  appearance: none;
  border: 1px solid var(--border);
  border-radius: 9px;
  aspect-ratio: 1 / 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  cursor: pointer;
  font: inherit;
  padding: 2px;
  min-height: 42px;
}
.cal-cell:hover { outline: 2px solid var(--accent); outline-offset: 1px; }
.cal-empty { border: 0; cursor: default; pointer-events: none; }
.cal-day { font-size: .82rem; font-weight: 650; }
.cal-pct { font-size: .62rem; opacity: .85; font-weight: 600; }
.cal-today { box-shadow: 0 0 0 2px var(--accent); }
.cal-future { opacity: .35; }
.cal-missing { border-style: dashed; }

/* ------------------------------ grafieken ----------------------------- */

.weight-chart { width: 100%; height: auto; aspect-ratio: 640 / 200; display: block; }
.wc-line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.wc-area { fill: color-mix(in srgb, var(--accent) 16%, transparent); stroke: none; }
.wc-dot { fill: var(--accent); stroke: var(--card); stroke-width: 1.5; }
.wc-grid { stroke: var(--border); stroke-width: 1; vector-effect: non-scaling-stroke; }
.wc-axis { fill: var(--muted); font-size: 11px; }
.wc-goal { stroke: #d9a30a; stroke-width: 1.5; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
.wc-goal-label { fill: #d9a30a; font-size: 11px; }

/* ---------------------------- instellingen ---------------------------- */

.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: .82rem; color: var(--muted); font-weight: 600; }
.field-input { position: relative; display: flex; align-items: center; }
.field-unit { position: absolute; right: 12px; color: var(--muted); font-size: .78rem; pointer-events: none; }
.field-hint { color: var(--muted); font-size: .75rem; }

.switch { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; cursor: pointer; }
.switch input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--accent); flex: 0 0 auto; }
.switch-label { display: block; font-weight: 550; font-size: .92rem; }
.switch-hint { display: block; color: var(--muted); font-size: .8rem; }

.weights { display: flex; flex-direction: column; gap: 10px; }
.weight-row { display: grid; grid-template-columns: minmax(140px, 1fr) minmax(100px, 1.2fr) 46px; align-items: center; gap: 10px; }
.weight-name { display: flex; align-items: center; gap: 7px; font-size: .9rem; font-weight: 550; }
.weight-val { text-align: right; color: var(--muted); font-size: .85rem; font-weight: 650; }
input[type="range"] { width: 100%; accent-color: var(--accent); }

.row-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: .84rem; color: var(--muted); cursor: pointer; }
.check input { accent-color: var(--accent); }

.alert { border-radius: 10px; padding: 12px; font-size: .87rem; margin-top: 12px; }
.alert-ok { background: color-mix(in srgb, #2f7a3f 16%, transparent); border: 1px solid color-mix(in srgb, #2f7a3f 45%, transparent); }
.alert-bad { background: color-mix(in srgb, var(--danger) 16%, transparent); border: 1px solid color-mix(in srgb, var(--danger) 45%, transparent); }

.preview { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: .82rem; }
.preview th, .preview td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); }
.preview th { color: var(--muted); font-weight: 600; }

.scheiding { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }
.sync-status { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.uitleg { margin-top: 14px; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.uitleg summary { cursor: pointer; font-weight: 600; font-size: .9rem; }
.uitleg[open] summary { margin-bottom: 10px; }
.uitleg code { background: var(--card-2); padding: 1px 5px; border-radius: 5px; font-size: .85em; }
.sql {
  background: var(--card-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
  overflow-x: auto;
  font-size: .72rem;
  line-height: 1.45;
  margin: 12px 0 0;
}

.explain { margin: 0; padding-left: 20px; color: var(--muted); font-size: .88rem; display: flex; flex-direction: column; gap: 7px; }
ol.explain { list-style: decimal; }
.explain em { color: var(--text); font-style: normal; font-weight: 600; }

/* -------------------------------- toast ------------------------------- */

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(20px + env(safe-area-inset-bottom));
  transform: translate(-50%, 20px);
  background: var(--bg-elev);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  padding: 10px 16px;
  font-size: .88rem;
  font-weight: 550;
  box-shadow: var(--shadow);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 50;
  max-width: calc(100vw - 32px);
}
.toast-show { opacity: 1; transform: translate(-50%, 0); }
.toast-bad { border-color: color-mix(in srgb, var(--danger) 60%, var(--border)); }

/* ------------------------------- oefeningen --------------------------- */

.card-quiet { opacity: .65; }
.hint-tight { margin-top: 8px; }
.schema-keuze { margin-bottom: 14px; }

.lifts { display: flex; flex-direction: column; gap: 12px; }

.lift {
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--card-2);
  padding: 10px 12px;
}
.lift-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.lift-name { font-weight: 600; font-size: .95rem; }

.lift-side { display: flex; align-items: flex-start; gap: 8px; margin-top: 8px; }
.lift-side + .lift-side { border-top: 1px dashed var(--border); padding-top: 8px; }
.lift-body { flex: 1; min-width: 0; }
.lift-arm {
  flex: none;
  width: 22px;
  margin-top: 9px;
  text-align: center;
  font-size: .72rem;
  font-weight: 700;
  color: var(--muted);
}

.lift-inputs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.lift-field { position: relative; display: flex; align-items: center; width: 92px; }
.lift-field input { padding: 8px 34px 8px 10px; font-size: .9rem; }
.lift-field .measure-unit { right: 10px; font-size: .72rem; }
.lift-x { color: var(--muted); font-size: .9rem; }
.lift-status { margin-left: auto; white-space: nowrap; }

.lift-hist { color: var(--muted); font-size: .78rem; margin-top: 5px; }
.lift-date { opacity: .7; }

.lift-add { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.lift-add input[type="text"] { flex: 1; min-width: 150px; }

/* ---------------------------- schema-instellingen --------------------- */

.schemas { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; }
.schema { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; background: var(--card-2); }
.schema-head { display: flex; gap: 8px; align-items: center; }
.schema-titel { font-weight: 650; }
.schema-lijst { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }

.schema-oef {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  padding-bottom: 8px;
  border-bottom: 1px dashed var(--border);
}
.schema-oef:last-child { padding-bottom: 0; border-bottom: 0; }
.schema-naam { flex: 1; min-width: 130px; }
.schema-oef select { width: auto; min-width: 120px; font-size: .82rem; padding: 6px 8px; }
.schema-arm { display: flex; align-items: center; gap: 5px; font-size: .78rem; color: var(--muted); white-space: nowrap; }
.schema-arm input { width: auto; }

  var COLOR_STOPS = [
    { p: 0,   c: [122, 12, 18] },   // donkerrood
    { p: 20,  c: [178, 30, 30] },
    { p: 40,  c: [214, 96, 20] },
    { p: 55,  c: [217, 154, 10] },  // amber
    { p: 70,  c: [154, 168, 20] },
    { p: 85,  c: [77, 145, 46] },
    { p: 100, c: [13, 82, 34] }     // donkergroen

  function clamp(v, min, max) { return v < min ? min : (v > max ? max : v); }

  function scoreColor(pct) {
    if (pct === null || pct === undefined || isNaN(pct)) return '#3a3f4b';
    var p = clamp(pct, 0, 100);
    var a = COLOR_STOPS[0], b = COLOR_STOPS[COLOR_STOPS.length - 1];
    for (var i = 0; i < COLOR_STOPS.length - 1; i++) {
      if (p >= COLOR_STOPS[i].p && p <= COLOR_STOPS[i + 1].p) {
        a = COLOR_STOPS[i];
        b = COLOR_STOPS[i + 1];
        break;
      }
    }
    var t = b.p === a.p ? 0 : (p - a.p) / (b.p - a.p);

  }

    return '+' + ml + ' ml';
  }

  global.GD.formatVolume = formatVolume;
  global.GD.stepLabel = stepLabel;
  global.GD.goalByKey = function (key) {
    for (var i = 0; i < GOALS.length; i++) if (GOALS[i].key === key) return GOALS[i];
    return null;
  };
})(window);

  <script>
/* Goal Dashboard - opslag (localStorage) + datum-helpers */
(function (global) {
  'use strict';

  var GD = global.GD;

  /* ---------------------------- datums ---------------------------- */

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  /** Lokale datum -> "YYYY-MM-DD" (geen UTC-verschuiving) */
  function iso(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  /** "YYYY-MM-DD" -> Date (lokale middernacht) */
  function parse(s) {
    var p = s.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }

  function today() { return iso(new Date()); }

  function addDays(s, n) {
    var d = parse(s);
    d.setDate(d.getDate() + n);
    return iso(d);
  }

  function addMonths(s, n) {
    var d = parse(s);
    var day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    var last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(day, last));
    return iso(d);
  }

  /** Maandag van de week waarin `s` valt */
  function startOfWeek(s) {
    var d = parse(s);
    var wd = (d.getDay() + 6) % 7; // ma=0 ... zo=6
    d.setDate(d.getDate() - wd);
    return iso(d);
  }

  function startOfMonth(s) {
    var d = parse(s);
    return iso(new Date(d.getFullYear(), d.getMonth(), 1));
  }

  function endOfMonth(s) {
    var d = parse(s);
    return iso(new Date(d.getFullYear(), d.getMonth() + 1, 0));
  }

  /** Lijst met datums van `from` t/m `to` (inclusief) */
  function range(from, to) {
    var out = [], cur = from;
    var guard = 0;
    while (cur <= to && guard++ < 1000) {
      out.push(cur);
      cur = addDays(cur, 1);
    }
    return out;
  }

  /** ISO-weeknummer */
  function isoWeek(s) {
    var d = parse(s);
    var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    t.setDate(t.getDate() + 3 - ((t.getDay() + 6) % 7));
    var week1 = new Date(t.getFullYear(), 0, 4);
    return 1 + Math.round(
      ((t - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7
    );
  }

  var DAY_NAMES = ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'];
  var MONTH_NAMES = ['januari', 'februari', 'maart', 'april', 'mei', 'juni',
    'juli', 'augustus', 'september', 'oktober', 'november', 'december'];

  function dayName(s) { return DAY_NAMES[(parse(s).getDay() + 6) % 7]; }
  function monthName(s) { return MONTH_NAMES[parse(s).getMonth()]; }

  function formatDate(s) {
    var d = parse(s);
    return dayName(s) + ' ' + d.getDate() + ' ' + MONTH_NAMES[d.getMonth()] + ' ' + d.getFullYear();
  }

  function formatShort(s) {
    var d = parse(s);
    return d.getDate() + ' ' + MONTH_NAMES[d.getMonth()].slice(0, 3);
  }

  function relativeLabel(s) {
    var t = today();
    if (s === t) return 'Vandaag';
    if (s === addDays(t, -1)) return 'Gisteren';
    if (s === addDays(t, 1)) return 'Morgen';
    return null;
  }

  /* ---------------------------- opslag ---------------------------- */

  function emptyState() {
    return {
      version: 2,
      settings: clone(GD.DEFAULT_SETTINGS),
      settingsTs: 0,
      entries: {},
      // Gewiste dagen onthouden we, anders zet een synchronisatie ze terug.
      tombstones: {}
    };
  }

  /**
   * Tijdstempel van een dag: elke wijziging zet hem op nu. Dagen van vóór de
   * synchronisatie krijgen 1, zodat een echt bewerkte versie elders wint.
   */
  function entryTs(date) {
    var e = load().entries[date];
    if (e && typeof e._ts === 'number') return e._ts;
    if (e) return 1;
    var t = load().tombstones[date];
    return typeof t === 'number' ? t : 0;
  }

  function stamp(date, ts) {
    var e = load().entries[date];
    if (e) e._ts = ts === undefined ? Date.now() : ts;
  }

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  var state = null;

  function load() {
    if (state) return state;
    state = emptyState();
    try {
      var raw = global.localStorage.getItem(GD.STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        state = migrate(parsed);
      }
    } catch (e) {
      console.warn('Kon opgeslagen data niet lezen, start leeg.', e);
    }
    return state;
  }

  function migrate(data) {
    var s = emptyState();
    if (data && typeof data === 'object') {
      if (data.settings) {
        Object.keys(s.settings).forEach(function (k) {
          if (k === 'weights') return;
          if (data.settings[k] !== undefined) s.settings[k] = data.settings[k];
        });
        if (data.settings.weights) {
          Object.keys(s.settings.weights).forEach(function (k) {
            var w = data.settings.weights[k];
            if (typeof w === 'number' && isFinite(w) && w >= 0) s.settings.weights[k] = w;
          });
        }
      }
      // Lijsten moeten lijsten blijven, ook als er ooit iets raars binnenkomt.
      ['oefeningen', 'schemas'].forEach(function (k) {
        if (!Array.isArray(s.settings[k])) s.settings[k] = [];
      });
      if (typeof data.settingsTs === 'number') s.settingsTs = data.settingsTs;
      if (data.entries && typeof data.entries === 'object') {
        Object.keys(data.entries).forEach(function (date) {
          if (/^\d{4}-\d{2}-\d{2}$/.test(date)) s.entries[date] = data.entries[date];
        });
      }
      if (data.tombstones && typeof data.tombstones === 'object') {
        Object.keys(data.tombstones).forEach(function (date) {
          if (/^\d{4}-\d{2}-\d{2}$/.test(date) && typeof data.tombstones[date] === 'number') {
            s.tombstones[date] = data.tombstones[date];
          }
        });
      }
    }
    return s;
  }

  var saveTimer = null;
  /* Telt elke wijziging; de oefeningen-historie hangt haar cache hieraan op. */
  var rev = 0;

  function writeNow() {
    if (saveTimer) {
      clearTimeout(saveTimer);
      saveTimer = null;
    }
    if (!state) return;
    try {
      global.localStorage.setItem(GD.STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.error('Opslaan mislukt', e);
      alert('Opslaan mislukt: de opslag van je browser zit vol of staat uit.');
    }
  }

  function save() {
    rev++;
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(writeNow, 120);
  }

  // Op een telefoon kan de app zomaar naar de achtergrond gaan; schrijf dan
  // meteen weg in plaats van te wachten op de timer.
  global.addEventListener('pagehide', writeNow);
  global.addEventListener('beforeunload', writeNow);
  global.document.addEventListener('visibilitychange', function () {
    if (global.document.visibilityState === 'hidden') writeNow();
  });

  function settings() { return load().settings; }

  function setSetting(key, value) {
    load().settings[key] = value;
    load().settingsTs = Date.now();
    save();
    changed();
  }

  function setWeight(key, value) {
    load().settings.weights[key] = value;
    load().settingsTs = Date.now();
    save();
    changed();
  }

  /* Luisteraars (de synchronisatie) op de hoogte brengen van wijzigingen. */
  var listeners = [];
  function onChange(fn) { listeners.push(fn); }
  function changed() {
    listeners.forEach(function (fn) {
      try { fn(); } catch (e) { console.error(e); }
    });
  }

  function entry(date) {
    return load().entries[date] || null;
  }

  /** Entry ophalen of aanmaken */
  function ensureEntry(date) {
    var st = load();
    if (!st.entries[date]) st.entries[date] = { date: date };
    return st.entries[date];
  }

  function setField(date, field, value) {
    var e = ensureEntry(date);
    if (value === null || value === undefined || value === '') delete e[field];
    else e[field] = value;
    if (isEmptyEntry(e)) {
      delete load().entries[date];
      load().tombstones[date] = Date.now();
    } else {
      e._ts = Date.now();
      delete load().tombstones[date];
    }
    save();
    changed();
  }

  function isEmptyEntry(e) {
    return !Object.keys(e).some(function (k) {
      return k !== 'date' && k !== '_ts' &&
        e[k] !== null && e[k] !== undefined && e[k] !== '';
    });
  }

  function deleteEntry(date) {
    delete load().entries[date];
    load().tombstones[date] = Date.now();
    save();
    changed();
  }

  function allDates() {
    return Object.keys(load().entries).sort();
  }

  function reset() {
    rev++;
    state = emptyState();
    try { global.localStorage.removeItem(GD.STORAGE_KEY); } catch (e) { /* leeg */ }
  }

  function exportJSON() {
    return JSON.stringify(load(), null, 2);
  }

  /**
   * Importeer een eerder geëxporteerd bestand.
   * mode 'merge' behoudt bestaande dagen die niet in het bestand zitten.
   */
  function importJSON(text, mode) {
    var data = JSON.parse(text);
    var incoming = migrate(data);
    if (mode === 'merge') {
      var st = load();
      Object.keys(incoming.entries).forEach(function (d) {
        st.entries[d] = incoming.entries[d];
      });
      st.settings = incoming.settings;
    } else {
      state = incoming;
    }
    save();
    return Object.keys(incoming.entries).length;
  }

  GD.store = {
    load: load,
    save: save,
    writeNow: writeNow,
    settings: settings,
    setSetting: setSetting,
    setWeight: setWeight,
    entry: entry,
    ensureEntry: ensureEntry,
    setField: setField,
    deleteEntry: deleteEntry,
    allDates: allDates,
    reset: reset,
    exportJSON: exportJSON,
    importJSON: importJSON,
    entryTs: entryTs,
    stamp: stamp,
    rev: function () { return rev; },
    onChange: onChange,
    changed: changed,
    /* Rechtstreekse toegang voor de synchronisatie. */
    raw: function () { return load(); },
    putEntry: function (date, data, ts) {
      var st = load();
      data.date = date;
      data._ts = ts;
      st.entries[date] = data;
      delete st.tombstones[date];
      save();
    },
    removeEntry: function (date, ts) {
      var st = load();
      delete st.entries[date];
      st.tombstones[date] = ts;
      save();
    },
    putSettings: function (data, ts) {
      var st = load();
      st.settings = migrate({ settings: data }).settings;
      st.settingsTs = ts;
      save();
    }
  };

  GD.date = {
    iso: iso,
    parse: parse,
    today: today,
    addDays: addDays,
    addMonths: addMonths,

/* Goal Dashboard - oefeningen, trainingsschema's en progressive overload
 *
 * Per training leg je van elke oefening één regel vast: je beste set. De app
 * zoekt daar de vorige keer bij die je diezelfde oefening deed - niet gisteren,
 * maar de laatste sessie waarin hij voorkomt - en bepaalt of je vooruit bent
 * gegaan. Daaruit volgt automatisch het doel "Progressive overload".
 *
 * Oefeningen kennen twee bijzonderheden:
 * - type 'reps': geen gewicht, alleen herhalingen (pull-ups, leg raises).
 * - perArm: rechts en links tellen apart, elk met een eigen vergelijking.
 */
(function (global) {
  'use strict';

  var GD = global.GD;
  var store = GD.store;

  function num(v) {
    if (v === null || v === undefined || v === '') return null;
    var n = typeof v === 'number' ? v : parseFloat(String(v).replace(',', '.'));
    return isFinite(n) ? n : null;
  }

  function nieuwId(prefix) {
    return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  /* ------------------------------ oefeningen ------------------------------ */

  function oefeningen() {
    var l = store.settings().oefeningen;
    return Array.isArray(l) ? l : [];
  }

  function schemas() {
    var l = store.settings().schemas;
    return Array.isArray(l) ? l : [];
  }

  function bewaarOefeningen(lijst) { store.setSetting('oefeningen', lijst); }
  function bewaarSchemas(lijst) { store.setSetting('schemas', lijst); }

  function byId(oid) {
    var l = oefeningen();
    for (var i = 0; i < l.length; i++) if (l[i].id === oid) return l[i];
    return null;
  }

  function schemaById(sid) {
    var l = schemas();
    for (var i = 0; i < l.length; i++) if (l[i].id === sid) return l[i];
    return null;
  }

  function naam(oid) {
    var o = byId(oid);
    return o ? o.naam : 'Verwijderde oefening';
  }

  function zoekOpNaam(tekst) {
    var n = String(tekst || '').trim().toLowerCase();
    if (!n) return null;
    var l = oefeningen();
    for (var i = 0; i < l.length; i++) {
      if (String(l[i].naam).trim().toLowerCase() === n) return l[i];
    }
    return null;
  }

  /** Maakt een oefening aan, of geeft de bestaande met dezelfde naam terug. */
  function addOefening(tekst, opties) {
    var n = String(tekst || '').trim();
    if (!n) return null;
    var bestaand = zoekOpNaam(n);
    if (bestaand) return bestaand.id;
    var o = {
      id: nieuwId('o'),
      naam: n,
      type: (opties && opties.type) === 'reps' ? 'reps' : 'gewicht',
      perArm: !!(opties && opties.perArm),
      startDatum: null
    };
    var lijst = oefeningen().slice();
    lijst.push(o);
    bewaarOefeningen(lijst);
    return o.id;
  }

  function updateOefening(oid, velden) {
    var lijst = oefeningen().map(function (o) {
      if (o.id !== oid) return o;
      var kopie = JSON.parse(JSON.stringify(o));
      Object.keys(velden).forEach(function (k) { kopie[k] = velden[k]; });
      return kopie;
    });
    bewaarOefeningen(lijst);
  }

  function deleteOefening(oid) {
    bewaarOefeningen(oefeningen().filter(function (o) { return o.id !== oid; }));
    bewaarSchemas(schemas().map(function (s) {
      var kopie = JSON.parse(JSON.stringify(s));
      kopie.oefeningen = (kopie.oefeningen || []).filter(function (id) { return id !== oid; });
      return kopie;
    }));

  /** Vanaf vandaag opnieuw beginnen, bijvoorbeeld na een blessure of deload. */
  function resetStart(oid, datum) {
    updateOefening(oid, { startDatum: datum || GD.date.today() });

  /* -------------------------------- schema's ------------------------------ */

  function addSchema(tekst) {

    var lijst = schemas().slice();
    lijst.push(s);

        { naam: 'Tricep overhead', perArm: true },
        { naam: 'Cable crunch' },

        { naam: 'Seated barbel row' },
        { naam: 'Small lat pulldown' },
        { naam: 'Rows' },

  /* ------------------------------ dagelijkse invoer ----------------------- */

  /** Rechts en links tellen apart; gewone oefeningen hebben één naamloze kant. */

  function setDagSchema(datum, sid) {

   * gewicht telt als 0 kg, zodat pull-ups en leg raises gewoon werken.

  function leesZijde(waarde, zijdeKey) {

    updateOefening: updateOefening,

    zijden: zijden,

/* Goal Dashboard - scoreberekening */
(function (global) {
  'use strict';

  var GD = global.GD;
  var store = GD.store;
  var D = GD.date;

  function optionFor(goal, value) {
    if (!goal.options) return null;
    for (var i = 0; i < goal.options.length; i++) {
      if (goal.options[i].v === value) return goal.options[i];
    }
    return null;
  }

  /**
   * Waarde van een doel voor een dag, inclusief automatische afleiding
   * uit ingevulde eiwitten/calorieën.
   * -> { value, auto }
   */
  function resolveValue(entry, goal, settings) {
    if (!entry) return { value: null, auto: false };

    // Progressive overload volgt uit de ingevulde oefeningen. Staan die er niet
    // (zoals bij dagen van vóór deze functie), dan geldt je eigen antwoord nog.
    if (goal.key === 'overload' && GD.lifts && entry.date) {
      var lift = GD.lifts.dagResultaat(entry.date);
      if (lift.waarde) return { value: lift.waarde, auto: true, lifts: lift };
    }

    var explicit = entry[goal.key];
    if (explicit !== null && explicit !== undefined && explicit !== '') {
      return { value: explicit, auto: false };
    }
    if (!settings.autoMacro || !goal.macro) return { value: null, auto: false };

    if (goal.macro === 'protein') {
      var g = num(entry.eiwitGram);
      if (g === null) return { value: null, auto: false };
      return { value: g >= num(settings.eiwitDoel, 0) ? 'ja' : 'nee', auto: true };
    }
    if (goal.macro === 'calories') {
      var kcal = num(entry.kcal);
      if (kcal === null) return { value: null, auto: false };
      var doel = num(settings.calorieDoel, 0);
      var ok;
      if (settings.calorieRichting === 'min') ok = kcal >= doel;
      else if (settings.calorieRichting === 'rond') ok = Math.abs(kcal - doel) <= num(settings.calorieMarge, 0);
      else ok = kcal <= doel;
      return { value: ok ? 'ja' : 'nee', auto: true };
    }
    return { value: null, auto: false };
  }

  function num(v, fallback) {
    if (v === null || v === undefined || v === '') return fallback === undefined ? null : fallback;
    var n = typeof v === 'number' ? v : parseFloat(String(v).replace(',', '.'));
    return isFinite(n) ? n : (fallback === undefined ? null : fallback);

   *

   * kelderde je dagscore 's ochtends door een doel waar je nog aan bezig bent.
   * Bij afgelopen dagen telt gewoon het deel dat je haalde.
   */
  function meterItem(goal, entry, settings, w, live) {
    var amount = entry ? num(entry[goal.field]) : null;
    var doel = num(settings[goal.doelKey], 0);
    var item = {
      key: goal.key,
      goal: goal,
      value: amount,
      amount: amount,
      doel: doel,
      auto: false,
      option: null,
      weight: w,
      score: null,
      included: false,
      reason: ''

    var frac = null;
    if (amount !== null) {
      frac = doel > 0 ? GD.clamp(amount / doel, 0, 1) : (amount > 0 ? 1 : 0);
    }
    item.frac = frac;

    if (w === 0) {
      item.reason = 'uitgezet';
    } else if (amount === null) {
      if (live) {
        item.reason = 'nog niet ingevuld';
      } else {
        item.score = 0;
        item.included = true;
        item.reason = 'niet ingevuld';
      }
    } else if (live && frac < 1) {
      item.reason = 'nog bezig';
    } else {
      item.score = frac;
      item.included = true;
    }
    return item;
  }

  /**
   * Score van één dag.
   * live=true : nog niet ingevulde doelen tellen niet mee (voor vandaag/toekomst)

   */
  function scoreDay(date, live) {
    var settings = store.settings();
    var entry = store.entry(date);
    if (live === undefined) live = date >= D.today();

    var gesportGoal = GD.goalByKey('gesport');

    var trained = trainedValue === 'ja';

        var mItem = meterItem(goal, entry, settings, w, live);
        if (mItem.included) {
          points += mItem.score * w;
          max += w;
        }
        items.push(mItem);
        return;
      }

      var opt = res.value ? optionFor(goal, res.value) : null;
      var item = {
        key: goal.key,
        goal: goal,
        value: res.value,
        auto: res.auto,
        option: opt,
        weight: w,
        score: null,
        included: false,
        reason: ''
      };

      if (w === 0) {
        item.reason = 'uitgezet';
      } else if (goal.onlyIfTrained && !trained) {
        if (trainedValue === 'rustdag') item.reason = 'rustdag';
        else if (trainedValue) item.reason = 'niet getraind';

        item.included = true;

        points += item.score * w;
        max += w;
      }

  function baseMax() {

  /**

  function scorePeriod(dates) {

    // gebruikte je het dashboard nog niet.
    var known = store.allDates();
    var firstEver = known.length ? known[0] : null;
    var points = 0, max = 0;
    var days = [];

    var bd = {};

      '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="var(--track)" stroke-width="' + stroke + '"/>' +
      '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + color + '"' +

    }

    var xLabels = '<text x="' + padL + '" y="' + (H - 6) + '" class="wc-axis">' + esc(D.formatShort(points[0].date)) + '</text>' +
      '<text x="' + (W - padR) + '" y="' + (H - 6) + '" text-anchor="end" class="wc-axis">' +
      esc(D.formatShort(points[points.length - 1].date)) + '</text>';

    var dayFirst = opts.dayFirst !== false;
    var rows = parseCSV(text, detectDelimiter(text));
    if (rows.length < 2) return { ok: false, error: 'Het bestand bevat geen bruikbare regels.' };

    var headers = rows[0].map(function (h) { return String(h).trim().toLowerCase(); });
    var iDate = findColumn(headers, [/^date$/, /datum/, /date/, /^dag$/]);
    var iKcal = findColumn(headers, [/^calories$/, /calorie/, /kcal/, /energie/, /energy/]);
    var iProt = findColumn(headers, [/^protein/, /protein/, /eiwit/]);

    if (iDate < 0) {
      return { ok: false, error: 'Geen datumkolom gevonden. Verwachte kolomnaam: "Date" of "Datum".' };
    }
    if (iKcal < 0 && iProt < 0) {
      return { ok: false, error: 'Geen kolom voor calorieën of eiwit gevonden.' };
    }

    var days = {}, skipped = 0;
    for (var r = 1; r < rows.length; r++) {
      var row = rows[r];
      var date = parseDate(row[iDate], dayFirst);
      if (!date) { skipped++; continue; }
      // Samenvattingsregels ("Totals") overslaan als ze geen echte datum hebben.
      if (!days[date]) days[date] = { kcal: null, protein: null };
      if (iKcal >= 0) {
        var k = toNumber(row[iKcal]);
        if (k !== null) days[date].kcal = (days[date].kcal || 0) + k;
      }
      if (iProt >= 0) {
        var p = toNumber(row[iProt]);
        if (p !== null) days[date].protein = (days[date].protein || 0) + p;
      }
    }

    var dates = Object.keys(days).sort();
    if (!dates.length) {
      return { ok: false, error: 'Geen geldige datums gevonden in de datumkolom.' };
    }

    return {
      ok: true,
      days: days,
      dates: dates,
      skipped: skipped,
      columns: {
        date: rows[0][iDate],
        calories: iKcal >= 0 ? rows[0][iKcal] : null,
        protein: iProt >= 0 ? rows[0][iProt] : null
      }
    };
  }

  /**
   * Schrijft de gevonden waarden weg in de dagentries.
   * overwrite=false laat handmatig ingevulde waarden staan.
   */
  function apply(result, overwrite) {
    var store = GD.store;
    var written = 0, skipped = 0;
    result.dates.forEach(function (date) {
      var d = result.days[date];
      var e = store.entry(date);
      var wroteSomething = false;

      if (d.kcal !== null && Math.round(d.kcal) > 0) {
        if (overwrite || !e || e.kcal === undefined || e.kcal === null) {
          store.setField(date, 'kcal', Math.round(d.kcal));
          wroteSomething = true;
        } else skipped++;
      }
      if (d.protein !== null && Math.round(d.protein) > 0) {
        if (overwrite || !e || e.eiwitGram === undefined || e.eiwitGram === null) {
          store.setField(date, 'eiwitGram', Math.round(d.protein));
          wroteSomething = true;
        } else skipped++;
      }
      if (wroteSomething) written++;
    });
    return { written: written, skipped: skipped };
  }

  GD.mfp = {
    parse: parse,
    apply: apply,
    parseDate: parseDate,
    parseCSV: parseCSV,
    toNumber: toNumber
  };
})(window);

  <script>
/* Goal Dashboard - synchronisatie via Supabase
 *
 * Opzet:
 * - localStorage blijft de bron waar de app mee werkt, dus offline invullen
 *   blijft gewoon werken. De cloud is een kopie die we bij elkaar brengen.
 * - Per dag geldt: de laatste wijziging wint. Elke dag draagt een tijdstempel,
 *   ook gewiste dagen (die onthouden we, anders komen ze terug).
 * - Inloggen gaat met een code per e-mail; er is geen wachtwoord.
 *
 * Er wordt geen SDK geladen: alles gaat rechtstreeks via de REST-API van
 * Supabase, zodat het project zonder build-stap blijft werken.
 */
(function (global) {
  'use strict';

  var GD = global.GD;
  var store = GD.store;

  var CONFIG_KEY = 'goaldash.sync';

  var cfg = null;
  var bezig = false;
  var pushTimer = null;
  var listeners = [];
  var appliedListeners = [];

  /* ----------------------------- instellingen ----------------------------- */

  function config() {
    if (cfg) return cfg;
    cfg = { url: '', anonKey: '', session: null, laatst: null, fout: '' };
    try {
      var raw = global.localStorage.getItem(CONFIG_KEY);
      if (raw) {
        var p = JSON.parse(raw);
        ['url', 'anonKey', 'session', 'laatst', 'fout'].forEach(function (k) {
          if (p[k] !== undefined) cfg[k] = p[k];
        });
      }
    } catch (e) {
      console.warn('Synchronisatie-instellingen onleesbaar', e);
    }
    return cfg;
  }

  function saveConfig() {
    try {
      global.localStorage.setItem(CONFIG_KEY, JSON.stringify(config()));
    } catch (e) {
      console.error('Kon synchronisatie-instellingen niet opslaan', e);
    }
    listeners.forEach(function (fn) { fn(); });
  }

  /**
   * Supabase toont op de Data API-pagina een "API URL" mét /rest/v1/ erachter,
   * terwijl wij de kale project-URL nodig hebben. Die staarten halen we er zelf
   * af, zodat het niet uitmaakt wat je plakt.
   */
  function normaliseerUrl(url) {
    var s = String(url || '').trim();
    if (!s) return '';
    if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
    // Zonder https reist je toegangstoken onversleuteld over de lijn. Alleen
    // een testserver op de eigen machine mag http blijven.
    if (/^http:\/\//i.test(s) && !/^http:\/\/(localhost|127\.0\.0\.1)([:/]|$)/i.test(s)) {
      s = s.replace(/^http:\/\//i, 'https://');
    }
    s = s.replace(/\/+$/, '');
    s = s.replace(/\/(rest|auth|realtime|storage|functions)\/v\d+$/i, '');
    return s.replace(/\/+$/, '');
  }

  function setConfig(url, anonKey) {
    var c = config();
    c.url = normaliseerUrl(url);
    c.anonKey = String(anonKey || '').trim();
    c.fout = '';
    saveConfig();
  }

  function isConfigured() {
    var c = config();
    return !!(c.url && c.anonKey);
  }

  function signedIn() {
    var c = config();
    return !!(c.session && c.session.access_token);
  }

  function email() {
    var c = config();
    return c.session && c.session.email ? c.session.email : '';
  }

  function onChange(fn) { listeners.push(fn); }

  /* -------------------------------- helpers ------------------------------- */

  function apiHeaders(withAuth) {
    var c = config();
    var h = {
      'apikey': c.anonKey,
      'Content-Type': 'application/json'
    };
    if (withAuth && c.session) h['Authorization'] = 'Bearer ' + c.session.access_token;
    return h;
  }

  /* Meldingen van Supabase komen in het Engels binnen; de bekende gevallen
     geven we in gewone taal terug. */
  var VERTALINGEN = [
    [/token has expired|invalid.*token|otp.*expired/i,
      'Die code klopt niet of is verlopen. Vraag een nieuwe aan.'],
    [/rate limit|too many requests/i,
      'Te veel pogingen achter elkaar. Wacht een minuut en probeer het opnieuw.'],
    [/invalid api key|no api key/i,
      'De anon key klopt niet. Kopieer hem opnieuw uit Project Settings → API.'],
    [/jwt|not authenticated|unauthorized/i,
      'Je sessie is verlopen. Log opnieuw in.'],
    [/relation .* does not exist|could not find the table/i,
      'De tabellen bestaan nog niet. Draai eerst het SQL-blok in de Supabase SQL Editor.'],
    [/row-level security|permission denied/i,
      'Geen toegang tot je rijen. Controleer of het SQL-blok volledig is uitgevoerd.'],
    [/signups not allowed for otp/i,
      'Er bestaat nog geen account met dit adres. Maak er eerst een aan met een wachtwoord.'],
    [/signups not allowed|email.*not authorized/i,
      'Dit e-mailadres mag niet inloggen. Zet in Supabase onder Authentication de e-mailaanmelding aan.'],
    [/invalid login credentials/i,
      'E-mailadres of wachtwoord klopt niet. Nog geen account? Gebruik "Account aanmaken".'],
    [/email not confirmed/i,
      'Dit account is nog niet bevestigd. Zet in Supabase onder Authentication → Sign In / Providers → ' +
      'Email de optie "Confirm email" uit, en probeer opnieuw.'],
    [/user already registered|already been registered/i,
      'Er bestaat al een account met dit adres. Gebruik "Inloggen". Lukt dat niet, dan is het account ' +
      'ooit zonder wachtwoord aangemaakt: verwijder het in Supabase onder Authentication → Users en ' +
      'maak het hier opnieuw aan.'],
    [/password should be at least|weak password/i,
      'Kies een wachtwoord van minstens zes tekens.']
  ];

  function vertaal(tekst) {
    for (var i = 0; i < VERTALINGEN.length; i++) {
      if (VERTALINGEN[i][0].test(tekst)) return VERTALINGEN[i][1];
    }
    return tekst;
  }

  /** fetch die netwerkproblemen in begrijpelijke taal teruggeeft. */
  async function haal(url, opties) {
    try {
      return await fetch(url, opties);
    } catch (e) {
      throw new Error('Geen verbinding met de server. Controleer je internet en de project-URL.');
    }
  }

  async function leesFout(res, standaard) {
    var tekst = '';
    try {
      var body = await res.json();
      tekst = body.msg || body.message || body.error_description || body.error || body.hint || '';
    } catch (e) { /* geen json */ }
    if (tekst) return vertaal(tekst);
    if (res.status === 401 || res.status === 403) {
      return 'Geen toegang. Controleer je anon key en of je nog ingelogd bent.';
    }
    if (res.status === 404) {
      return 'Niet gevonden. Klopt de project-URL, en heb je het SQL-blok gedraaid?';
    }
    return standaard + ' (' + res.status + ')';
  }

  /* ------------------------------- inloggen ------------------------------- */

  /**
   * Vraagt een inlogcode aan; Supabase mailt een code én een link.
   *
   * De terugkeerpagina hoort als query-parameter mee (de REST-API kent het
   * options-object van de JavaScript-bibliotheek niet). Zonder deze parameter
   * valt Supabase terug op de Site URL van het project — standaard localhost.
   */
  async function sendCode(adres) {
    var c = config();
    var hier = global.location.href.split('#')[0];
    var res = await haal(c.url + '/auth/v1/otp?redirect_to=' + encodeURIComponent(hier), {
      method: 'POST',
      headers: apiHeaders(false),
      // Geen account aanmaken: dat zou een gebruiker zonder wachtwoord opleveren,
      // waarmee inloggen daarna onmogelijk is.
      body: JSON.stringify({ email: adres, create_user: false })
    });
    if (!res.ok) throw new Error(await leesFout(res, 'Versturen van de code mislukt'));
    return true;
  }

  /**
   * Inloggen met e-mailadres en wachtwoord. Dit is de eenvoudigste weg: de
   * gratis mailservice van Supabase laat je de e-mailsjablonen niet aanpassen,
   * dus een code van zes cijfers is daar niet zonder eigen SMTP te krijgen.
   */
  async function signIn(adres, wachtwoord) {
    var c = config();
    var res = await haal(c.url + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: apiHeaders(false),
      body: JSON.stringify({ email: adres, password: wachtwoord })
    });
    if (!res.ok) throw new Error(await leesFout(res, 'Inloggen mislukt'));
    bewaarSessie(await res.json());
    return true;
  }

  /** Maakt eenmalig een account aan; daarna log je op beide apparaten gewoon in. */
  async function signUp(adres, wachtwoord) {
    var c = config();
    var res = await haal(c.url + '/auth/v1/signup', {
      method: 'POST',
      headers: apiHeaders(false),
      body: JSON.stringify({ email: adres, password: wachtwoord })
    });
    if (!res.ok) throw new Error(await leesFout(res, 'Account aanmaken mislukt'));
    var data = await res.json();
    if (data.access_token) {
      bewaarSessie(data);
      return { ingelogd: true };
    }
    // Geen sessie terug: Supabase wacht op bevestiging per e-mail.
    return { ingelogd: false };
  }

  /** Wisselt de code uit de e-mail in voor een sessie. */
  async function verifyCode(adres, code) {
    var c = config();
    var res = await haal(c.url + '/auth/v1/verify', {
      method: 'POST',
      headers: apiHeaders(false),
      body: JSON.stringify({ email: adres, token: String(code).trim(), type: 'email' })
    });
    if (!res.ok) throw new Error(await leesFout(res, 'Code klopt niet of is verlopen'));
    var data = await res.json();
    bewaarSessie(data);
    return true;
  }

  function bewaarSessie(data) {
    var c = config();
    c.session = {
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      user_id: data.user ? data.user.id : (c.session && c.session.user_id),
      email: data.user ? data.user.email : (c.session && c.session.email),
      verloopt: Date.now() + ((data.expires_in || 3600) * 1000)
    };
    c.fout = '';
    saveConfig();
  }

  async function ververs() {
    var c = config();
    if (!c.session || !c.session.refresh_token) throw new Error('Niet ingelogd');
    var res = await haal(c.url + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: apiHeaders(false),
      body: JSON.stringify({ refresh_token: c.session.refresh_token })
    });
    if (!res.ok) {
      c.session = null;
      saveConfig();
      throw new Error('Je sessie is verlopen, log opnieuw in.');
    }
    bewaarSessie(await res.json());
  }

  /**
   * Uitloggen trekt de sessie ook bij Supabase in. Zonder die aanroep blijft de
   * refresh token daar geldig tot hij vanzelf verloopt, en heeft uitloggen geen
   * effect als iemand die token eerder van het apparaat had gehaald.
   * Lukt het niet (geen internet), dan wissen we hem hier alsnog.
   */
  async function signOut() {
    var c = config();
    var hadSessie = !!(c.session && c.session.access_token);
    if (hadSessie) {
      try {
        // scope=local: alleen deze sessie vervalt, je blijft op je andere
        // apparaat gewoon ingelogd.
        await fetch(c.url + '/auth/v1/logout?scope=local', {
          method: 'POST',
          headers: apiHeaders(true)
        });
      } catch (e) {
        console.warn('Sessie kon niet bij de server ingetrokken worden', e);
      }
    }
    c.session = null;
    c.laatst = null;
    c.fout = '';
    saveConfig();
  }

  /**
   * Als je op de link in de e-mail klikt, komen de tokens terug in de URL.
   * Die halen we eruit en poetsen we meteen weg uit de adresbalk.
   */
  function handleRedirect() {
    var hash = global.location.hash || '';
    if (hash.indexOf('access_token=') < 0) return false;
    var p = new URLSearchParams(hash.replace(/^#/, ''));
    var token = p.get('access_token');
    if (!token) return false;
    bewaarSessie({
      access_token: token,
      refresh_token: p.get('refresh_token'),
      expires_in: parseInt(p.get('expires_in') || '3600', 10),
      user: null
    });
    try {
      global.history.replaceState(null, '', global.location.pathname + global.location.search);
    } catch (e) {
      global.location.hash = '';
    }
    haalGebruiker();
    return true;
  }

  /** Vult e-mailadres en gebruikers-id aan na inloggen via de link. */
  async function haalGebruiker() {
    var c = config();
    try {
      var res = await haal(c.url + '/auth/v1/user', { headers: apiHeaders(true) });
      if (!res.ok) return;
      var u = await res.json();
      c.session.user_id = u.id;
      c.session.email = u.email;
      saveConfig();
    } catch (e) { /* niet kritiek */ }
  }

  /* ------------------------------ gegevens ------------------------------- */

  async function rest(pad, opties) {
    var c = config();
    opties = opties || {};
    if (c.session && c.session.verloopt && Date.now() > c.session.verloopt - 60000) {
      await ververs();
    }
    var res = await haal(c.url + '/rest/v1/' + pad, {
      method: opties.method || 'GET',
      headers: Object.assign(apiHeaders(true), opties.headers || {}),
      body: opties.body
    });
    if (res.status === 401) {
      await ververs();
      res = await haal(c.url + '/rest/v1/' + pad, {
        method: opties.method || 'GET',
        headers: Object.assign(apiHeaders(true), opties.headers || {}),
        body: opties.body
      });
    }
    if (!res.ok) throw new Error(await leesFout(res, 'Server gaf een fout'));
    return res;
  }

  function tijd(waarde) {
    if (!waarde) return 0;
    var n = typeof waarde === 'number' ? waarde : Date.parse(waarde);
    return isFinite(n) ? n : 0;
  }

  /**
   * Haalt de cloud op, past nieuwere dagen lokaal toe en stuurt de dagen
   * terug die hier recenter zijn. Per dag wint de laatste wijziging.
   */
  async function syncNow() {
    if (!isConfigured()) throw new Error('Vul eerst je project-URL en sleutel in.');
    if (!signedIn()) throw new Error('Log eerst in met je e-mailadres.');
    if (bezig) return null;
    bezig = true;
    listeners.forEach(function (fn) { fn(); });

    try {
      var c = config();
      var st = store.raw();
      var uid = c.session.user_id;

      // Het filter op user_id is een tweede slot naast de row level security in
      // Supabase: valt daar ooit een policy weg, dan vragen we nog steeds
      // alleen onze eigen rijen op.
      var res = await rest('dagen?select=datum,data,verwijderd,bijgewerkt&user_id=eq.' +
        encodeURIComponent(uid));
      var extern = await res.json();

      var externOp = {};
      var opgehaald = 0;
      extern.forEach(function (rij) {
        externOp[rij.datum] = rij;
        var lokaalTs = store.entryTs(rij.datum);
        var externTs = tijd(rij.bijgewerkt);
        if (externTs > lokaalTs) {
          if (rij.verwijderd) store.removeEntry(rij.datum, externTs);
          else store.putEntry(rij.datum, rij.data || {}, externTs);
          opgehaald++;
        }
      });

      // Alles wat hier nieuwer is dan in de cloud gaat de andere kant op.
      var teSturen = [];
      Object.keys(st.entries).forEach(function (datum) {
        var lokaalTs = store.entryTs(datum);
        var rij = externOp[datum];
        if (!rij || lokaalTs > tijd(rij.bijgewerkt)) {
          var kopie = JSON.parse(JSON.stringify(st.entries[datum]));
          delete kopie._ts;
          teSturen.push({
            user_id: uid,
            datum: datum,
            data: kopie,
            verwijderd: false,
            bijgewerkt: new Date(lokaalTs).toISOString()
          });
        }
      });
      Object.keys(st.tombstones).forEach(function (datum) {
        var lokaalTs = st.tombstones[datum];
        var rij = externOp[datum];
        if (!rij || lokaalTs > tijd(rij.bijgewerkt)) {
          teSturen.push({
            user_id: uid,
            datum: datum,
            data: null,
            verwijderd: true,
            bijgewerkt: new Date(lokaalTs).toISOString()
          });
        }
      });

      if (teSturen.length) {
        await rest('dagen', {
          method: 'POST',
          headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
          body: JSON.stringify(teSturen)
        });
      }

      var instellingen = await syncInstellingen(uid);

      if (opgehaald || instellingen === 'opgehaald') {
        appliedListeners.forEach(function (fn) {
          try { fn(); } catch (e) { console.error(e); }
        });
      }

      c.laatst = Date.now();
      c.fout = '';
      store.writeNow();
      saveConfig();
      return {
        opgehaald: opgehaald,
        verstuurd: teSturen.length,
        instellingen: instellingen
      };
    } catch (e) {
      config().fout = e.message || String(e);
      saveConfig();
      throw e;
    } finally {
      bezig = false;
      listeners.forEach(function (fn) { fn(); });
    }
  }

  /** Instellingen zijn één geheel: de nieuwste versie wint. */
  async function syncInstellingen(uid) {
    var st = store.raw();
    var res = await rest('instellingen?select=data,bijgewerkt&user_id=eq.' +
      encodeURIComponent(uid));
    var rijen = await res.json();
    var extern = rijen[0];
    var externTs = extern ? tijd(extern.bijgewerkt) : 0;
    var lokaalTs = st.settingsTs || 0;

    if (externTs > lokaalTs) {
      store.putSettings(extern.data || {}, externTs);
      return 'opgehaald';
    }
    if (lokaalTs > externTs) {
      await rest('instellingen', {
        method: 'POST',
        headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify([{
          user_id: uid,
          data: st.settings,
          bijgewerkt: new Date(lokaalTs).toISOString()
        }])
      });
      return 'verstuurd';
    }
    return 'gelijk';
  }

  /* ------------------------------ automatisch ----------------------------- */

  /** Na een wijziging even wachten en dan wegschrijven, niet bij elke tik. */
  function planPush() {
    if (!isConfigured() || !signedIn()) return;
    if (pushTimer) clearTimeout(pushTimer);
    pushTimer = setTimeout(function () {
      syncNow().catch(function (e) { console.warn('Automatisch synchroniseren mislukt:', e.message); });
    }, 4000);
  }

  function status() {
    var c = config();
    return {
      geconfigureerd: isConfigured(),
      ingelogd: signedIn(),
      email: email(),
      laatst: c.laatst,
      fout: c.fout,
      bezig: bezig
    };
  }

  function init() {
    handleRedirect();
    // Opent de link uit de mail in een venster waar de app al draait, dan
    // verandert alleen de hash en herlaadt de pagina niet.
    global.addEventListener('hashchange', function () {
      if (handleRedirect()) {
        syncNow().catch(function () { /* stil */ });
      }
    });
    store.onChange(planPush);
    if (isConfigured() && signedIn()) {
      syncNow().catch(function (e) { console.warn('Synchroniseren bij opstarten mislukt:', e.message); });
      global.document.addEventListener('visibilitychange', function () {
        if (global.document.visibilityState === 'visible') {
          syncNow().catch(function () { /* stil */ });
        }
      });
    }
  }

  GD.sync = {
    config: config,
    setConfig: setConfig,
    isConfigured: isConfigured,
    signedIn: signedIn,
    email: email,
    signIn: signIn,
    signUp: signUp,
    sendCode: sendCode,
    verifyCode: verifyCode,
    signOut: signOut,
    syncNow: syncNow,
    handleRedirect: handleRedirect,
    status: status,
    onChange: onChange,
    onApplied: function (fn) { appliedListeners.push(fn); },
    init: init
  };
})(window);
