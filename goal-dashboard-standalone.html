<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <!--
    De app laadt niets van buiten en praat alleen met je eigen Supabase-project.
    Dat leggen we hier vast, zodat de browser vreemde scripts weigert en er ook
    bij een fout in de code geen gegevens naar een ander adres kunnen.
    'unsafe-inline' bij style is nodig voor de style="width:..%"-attributen in
    de balken. Gebruik je een eigen domein voor Supabase, vul dat dan aan bij
    connect-src.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co https://*.supabase.in; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Dagelijks, wekelijks en maandelijks overzicht van je sport- en voedingsdoelen, met een gekleurd percentage van donkerrood naar donkergroen.">
  <meta name="theme-color" content="#11141a">
  <title>Goal Dashboard — sport &amp; voeding</title>
  <style>
/* Goal Dashboard - stijl */

:root {
  --bg: #0e1117;
  --bg-elev: #161b24;
  --card: #171d27;
  --card-2: #1d2531;
  --border: #262f3d;
  --text: #e7ecf5;
  --muted: #8e9bb0;
  --accent: #4c8dff;
  --track: #232c3a;
  --danger: #b3261e;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .25);
  --radius: 14px;
  --maxw: 940px;
}

html[data-theme="light"] {
  --bg: #f3f5f9;
  --bg-elev: #ffffff;
  --card: #ffffff;
  --card-2: #f1f4f9;
  --border: #dde3ec;
  --text: #16202e;
  --muted: #63708a;
  --accent: #2563eb;
  --track: #e3e8f0;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px rgba(16, 24, 40, .08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

h1, h2, h3 { margin: 0; font-weight: 650; letter-spacing: -.01em; }
h1 { font-size: 1.15rem; }
h2 { font-size: .95rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
p { margin: 0; }

/* ------------------------------- topbar ------------------------------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding-top: env(safe-area-inset-top);
}

.topbar-inner,
.tabs,
.period-nav,
.view,
.footer {
  max-width: var(--maxw);
  margin: 0 auto;
  padding-left: 16px;
  padding-right: 16px;
}

.topbar-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-top: 12px;
  padding-bottom: 4px;
}

.topbar-actions { display: flex; align-items: center; gap: 6px; }

#btn-sync { font-size: 1.15rem; }
#btn-sync:disabled { cursor: progress; opacity: .8; }
.btn-sync-bezig { animation: draai 1s linear infinite; }

@keyframes draai {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@media (prefers-reduced-motion: reduce) {
  .btn-sync-bezig { animation: none; opacity: .6; }
}

.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { font-size: 1.5rem; }
.brand-sub { font-size: .78rem; color: var(--muted); }

.tabs { display: flex; gap: 4px; padding-top: 8px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }

.tab {
  flex: 0 0 auto;
  appearance: none;
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  color: var(--muted);
  font: inherit;
  font-weight: 550;
  padding: 8px 12px 10px;
  cursor: pointer;
  white-space: nowrap;
}
.tab:hover { color: var(--text); }
.tab-active { color: var(--text); border-bottom-color: var(--accent); }

.period-nav {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-top: 10px;
  padding-bottom: 10px;
  border-top: 1px solid var(--border);
  margin-top: -1px;
}
.period-label { flex: 1; font-weight: 600; font-size: .95rem; text-align: center; }

/* -------------------------------- knoppen ----------------------------- */

.btn {
  appearance: none;
  font: inherit;
  font-weight: 550;
  color: var(--text);
  background: var(--card-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px 14px;
  cursor: pointer;
  transition: background .15s, border-color .15s, transform .05s;
}
.btn:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
.btn:active { transform: translateY(1px); }
.btn-sm { padding: 6px 10px; font-size: .85rem; }
.btn-icon { padding: 6px 12px; font-size: 1.1rem; line-height: 1.2; }
.btn-ghost { background: transparent; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-danger { background: transparent; color: #ef6a63; border-color: color-mix(in srgb, var(--danger) 50%, var(--border)); }
.btn-danger:hover { background: color-mix(in srgb, var(--danger) 18%, transparent); }
.btn[hidden] { display: none; }

/* -------------------------------- layout ------------------------------ */

.view {
  padding-top: 16px;
  padding-bottom: 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}

.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.card-head h2 { margin: 0; }
.card > h2 { margin-bottom: 12px; }
.card-foot { margin-top: 12px; display: flex; justify-content: flex-end; }

.hint { color: var(--muted); font-size: .84rem; margin-top: 10px; }
.empty { color: var(--muted); font-size: .9rem; padding: 12px 0; }

.footer { padding-bottom: calc(24px + env(safe-area-inset-bottom)); color: var(--muted); font-size: .8rem; }

/* --------------------------------- hero ------------------------------- */

.hero { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
.hero-ring { flex: 0 0 auto; }
.hero-info { flex: 1 1 240px; min-width: 220px; }
.hero-label { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; }
.hero-sub { color: var(--muted); font-size: .92rem; margin-top: 4px; }
.hero-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }

.trend { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.trend-ring { flex: 0 0 auto; }
.trend-info { flex: 1 1 220px; min-width: 200px; }
.trend-delta { font-size: 1.9rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }

.ring { display: block; }
.ring-pct { font-weight: 700; letter-spacing: -.03em; }
.ring-pct-sign { font-size: .5em; }
/* Wat er vandaag nog te halen valt: zichtbaar, maar duidelijk nog niet van jou. */
.ring-open { opacity: .3; }

.legend { display: flex; align-items: center; gap: 8px; margin-top: 14px; color: var(--muted); font-size: .72rem; }
.legend-bar { flex: 1; height: 8px; border-radius: 999px; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--card-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 2px 9px;
  font-size: .75rem;
  font-weight: 600;
  color: var(--muted);
  white-space: nowrap;
}
.chip-off { opacity: .7; }

/* -------------------------------- stats ------------------------------- */

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
}
.stat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
}
.stat-label { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; }
.stat-value { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; }
.stat-value .unit { font-size: .8rem; font-weight: 600; color: var(--muted); margin-left: 3px; }
.stat-sub { color: var(--muted); font-size: .78rem; }

/* ---------------------------- meetwaarden ----------------------------- */

.measure-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.measure { display: flex; flex-direction: column; gap: 6px; }
.measure-label { font-size: .82rem; color: var(--muted); font-weight: 600; }
.measure-input { position: relative; display: flex; align-items: center; }
.measure-unit {
  position: absolute; right: 12px; color: var(--muted); font-size: .82rem; pointer-events: none;
}

input[type="number"], input[type="text"], input[type="email"], input[type="url"],
input[type="password"], select, textarea {
  width: 100%;
  font: inherit;
  color: var(--text);
  background: var(--card-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  outline: none;
}
/* Herkomst van een meetwaarde: automatisch of zelf ingetikt. */
.bron {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: .72rem;
  font-weight: 600;
  color: var(--muted);
}
.bron-auto { color: color-mix(in srgb, var(--accent) 75%, var(--text)); }
.btn-mini {
  appearance: none;
  font: inherit;
  font-size: .72rem;
  font-weight: 650;
  color: var(--accent);
  background: none;
  border: 0;
  border-bottom: 1px solid currentColor;
  padding: 0;
  cursor: pointer;
}

.stappen > li { margin-bottom: 4px; }
.stap-regels { color: var(--muted); font-size: .82rem; margin-top: 2px; }
.stap-regels code { background: var(--card-2); padding: 1px 5px; border-radius: 5px; font-size: .92em; word-break: break-all; }

.meldregel {
  display: flex;
  align-items: baseline;
  gap: 7px;
  margin-top: 12px;
  font-size: .85rem;
  font-weight: 550;
  color: var(--muted);
}
.meldregel-icoon { flex: none; }

input[type="number"] { padding-right: 46px; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; padding-right: 12px; }

/* -------------------------------- doelen ------------------------------ */

.goals { display: flex; flex-direction: column; gap: 14px; }
.goal-dim { opacity: .55; }
.goal-off { opacity: .4; }
.goal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 7px; }
.goal-name { font-weight: 600; font-size: .95rem; display: flex; align-items: center; gap: 8px; }
.goal-icon { font-size: 1.05rem; }

.segmented { display: flex; gap: 6px; flex-wrap: wrap; }
.seg {
  flex: 1 1 0;
  min-width: 92px;
  appearance: none;
  font: inherit;
  font-size: .88rem;
  font-weight: 550;
  color: var(--muted);
  background: var(--card-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 8px;
  cursor: pointer;
  position: relative;
  transition: background .15s, color .15s, border-color .15s;
}
.seg:hover:not(:disabled) { color: var(--text); }
.seg:disabled { cursor: not-allowed; }
.seg-active {
  background: var(--seg-color, var(--accent));
  border-color: var(--seg-color, var(--accent));
  color: #fff;
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--seg-color, var(--accent)) 40%, transparent);
}
.auto-dot {
  display: block;
  font-size: .62rem;
  text-transform: uppercase;
  letter-spacing: .08em;
  opacity: .85;
}

/* -------------------------------- teller ------------------------------ */

.meter-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.meter-amount { font-size: 1.9rem; font-weight: 700; letter-spacing: -.02em; }
.meter-goal { color: var(--muted); font-size: .88rem; flex: 1; }
.meter-pct { font-size: 1.1rem; font-weight: 700; }

.meter-buttons { display: flex; gap: 8px; margin-top: 14px; }
.btn-add {
  flex: 1;
  padding: 16px 8px;
  font-size: 1rem;
  font-weight: 650;
  background: color-mix(in srgb, var(--accent) 16%, var(--card-2));
  border-color: color-mix(in srgb, var(--accent) 40%, var(--border));
}
.btn-add:hover { background: color-mix(in srgb, var(--accent) 28%, var(--card-2)); }

.meter-tweak { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.meter-manual { position: relative; display: flex; align-items: center; width: 110px; }
.meter-manual input { padding: 6px 34px 6px 10px; font-size: .85rem; }
.meter-manual .measure-unit { right: 10px; font-size: .75rem; }

/* ------------------------------ breakdown ----------------------------- */

.breakdown { display: flex; flex-direction: column; gap: 10px; }
.bd-row {
  display: grid;
  grid-template-columns: minmax(150px, 1.3fr) minmax(80px, 2fr) 48px;
  grid-template-areas: "name bar pct" "counts counts counts";
  align-items: center;
  gap: 6px 10px;
}
.bd-name { grid-area: name; display: flex; align-items: center; gap: 7px; font-size: .9rem; font-weight: 550; }
.bd-bar { grid-area: bar; }
.bd-pct { grid-area: pct; text-align: right; font-weight: 700; font-size: .9rem; }
.bd-counts { grid-area: counts; color: var(--muted); font-size: .75rem; }
.bd-off { opacity: .45; }
.bd-icon { font-size: 1rem; }

/* ---------------------------- weekafsluiting -------------------------- */

.rv-cijfers {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
  gap: 10px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
}
.rv-waarde { font-size: 1.4rem; font-weight: 700; letter-spacing: -.02em; }
.rv-waarde .unit { font-size: .78rem; font-weight: 600; color: var(--muted); margin-left: 1px; }
.rv-label { color: var(--muted); font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; }

.rv-blokken { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.rv-blok {
  background: var(--card-2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--rv-kleur, var(--border));
  border-radius: 10px;
  padding: 10px 12px;
}
.rv-kop { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: .92rem; }
.rv-icoon { font-size: 1rem; }
.rv-tekst { color: var(--muted); font-size: .86rem; margin-top: 4px; }

.rv-goed { --rv-kleur: #4d912e; }
.rv-let-op { --rv-kleur: #d99a0a; }
.rv-slecht { --rv-kleur: #b21e1e; }

.bar { height: 10px; background: var(--track); border-radius: 999px; overflow: hidden; }
.bar-fill { display: block; height: 100%; border-radius: 999px; transition: width .3s ease; }

/* ------------------------------- daybars ------------------------------ */

.daybars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.daybar {
  appearance: none;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}
.daybar-track {
  width: 100%;
  height: 110px;
  background: var(--track);
  border-radius: 8px;
  display: flex;
  align-items: flex-end;
  overflow: hidden;
}
.daybar-fill { width: 100%; border-radius: 8px 8px 0 0; transition: height .3s ease; }
.daybar-label { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; }
.daybar-val { font-size: .82rem; font-weight: 700; }
.daybar:hover .daybar-track { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ------------------------------ kalender ------------------------------ */

.calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal-head { text-align: center; color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; padding-bottom: 4px; }
.cal-cell {
  appearance: none;
  border: 1px solid var(--border);
  border-radius: 9px;
  aspect-ratio: 1 / 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  cursor: pointer;
  font: inherit;
  padding: 2px;
  min-height: 42px;
}
.cal-cell:hover { outline: 2px solid var(--accent); outline-offset: 1px; }
.cal-empty { border: 0; cursor: default; pointer-events: none; }
.cal-day { font-size: .82rem; font-weight: 650; }
.cal-pct { font-size: .62rem; opacity: .85; font-weight: 600; }
.cal-today { box-shadow: 0 0 0 2px var(--accent); }
.cal-future { opacity: .35; }
.cal-missing { border-style: dashed; }

/* ------------------------------ grafieken ----------------------------- */

.weight-chart { width: 100%; height: auto; aspect-ratio: 640 / 200; display: block; }
.wc-line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.wc-area { fill: color-mix(in srgb, var(--accent) 16%, transparent); stroke: none; }
.wc-dot { fill: var(--accent); stroke: var(--card); stroke-width: 1.5; }
.wc-grid { stroke: var(--border); stroke-width: 1; vector-effect: non-scaling-stroke; }
.wc-axis { fill: var(--muted); font-size: 11px; }
.wc-goal { stroke: #d9a30a; stroke-width: 1.5; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
.wc-goal-label { fill: #d9a30a; font-size: 11px; }

.lijn-grafiek { width: 100%; height: auto; aspect-ratio: 640 / 200; display: block; }
.lc-line { fill: none; stroke: var(--lc-kleur, var(--accent)); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.lc-dot { fill: var(--lc-kleur, var(--accent)); stroke: var(--card-2); stroke-width: 1.5; }
.lc-pr { stroke: var(--text); stroke-width: 2; }
.lc-serie-1 { --lc-kleur: #d9a30a; }
.lc-legenda { display: flex; flex-wrap: wrap; gap: 12px; color: var(--muted); font-size: .75rem; margin-top: 4px; }
.lc-merk {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 3px;
  background: var(--lc-kleur, var(--accent));
  margin-right: 5px;
  vertical-align: -1px;
}

/* ---------------------------- instellingen ---------------------------- */

.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: .82rem; color: var(--muted); font-weight: 600; }
.field-input { position: relative; display: flex; align-items: center; }
.field-unit { position: absolute; right: 12px; color: var(--muted); font-size: .78rem; pointer-events: none; }
.field-hint { color: var(--muted); font-size: .75rem; }

.switch { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; cursor: pointer; }
.switch input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--accent); flex: 0 0 auto; }
.switch-label { display: block; font-weight: 550; font-size: .92rem; }
.switch-hint { display: block; color: var(--muted); font-size: .8rem; }

.weights { display: flex; flex-direction: column; gap: 10px; }
.weight-row { display: grid; grid-template-columns: minmax(140px, 1fr) minmax(100px, 1.2fr) 46px; align-items: center; gap: 10px; }
.weight-name { display: flex; align-items: center; gap: 7px; font-size: .9rem; font-weight: 550; }
.weight-val { text-align: right; color: var(--muted); font-size: .85rem; font-weight: 650; }
input[type="range"] { width: 100%; accent-color: var(--accent); }

.row-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }

.alert { border-radius: 10px; padding: 12px; font-size: .87rem; margin-top: 12px; }
.alert-bad { background: color-mix(in srgb, var(--danger) 16%, transparent); border: 1px solid color-mix(in srgb, var(--danger) 45%, transparent); }

.scheiding { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }
.sync-status { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.uitleg { margin-top: 14px; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.uitleg summary { cursor: pointer; font-weight: 600; font-size: .9rem; }
.uitleg[open] summary { margin-bottom: 10px; }
.uitleg code { background: var(--card-2); padding: 1px 5px; border-radius: 5px; font-size: .85em; }
.sql {
  background: var(--card-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
  overflow-x: auto;
  font-size: .72rem;
  line-height: 1.45;
  margin: 12px 0 0;
}

.explain { margin: 0; padding-left: 20px; color: var(--muted); font-size: .88rem; display: flex; flex-direction: column; gap: 7px; }
ol.explain { list-style: decimal; }
.explain em { color: var(--text); font-style: normal; font-weight: 600; }

/* -------------------------------- toast ------------------------------- */

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(20px + env(safe-area-inset-bottom));
  transform: translate(-50%, 20px);
  background: var(--bg-elev);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  padding: 10px 16px;
  font-size: .88rem;
  font-weight: 550;
  box-shadow: var(--shadow);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 50;
  max-width: calc(100vw - 32px);
}

/* Goal Dashboard - opslag (localStorage) + datum-helpers */
(function (global) {
  'use strict';

  var GD = global.GD;

  /* ---------------------------- datums ---------------------------- */

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  /** Lokale datum -> "YYYY-MM-DD" (geen UTC-verschuiving) */
  function iso(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  /** "YYYY-MM-DD" -> Date (lokale middernacht) */
  function parse(s) {
    var p = s.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }

  function today() { return iso(new Date()); }

  function addDays(s, n) {
    var d = parse(s);
    d.setDate(d.getDate() + n);
    return iso(d);
  }

  function addMonths(s, n) {
    var d = parse(s);
    var day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    var last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(day, last));
    return iso(d);
  }

  /** Maandag van de week waarin `s` valt */
  function startOfWeek(s) {
    var d = parse(s);
    var wd = (d.getDay() + 6) % 7; // ma=0 ... zo=6
    d.setDate(d.getDate() - wd);
    return iso(d);
  }

  function startOfMonth(s) {
    var d = parse(s);
    return iso(new Date(d.getFullYear(), d.getMonth(), 1));
  }

  function endOfMonth(s) {
    var d = parse(s);
    return iso(new Date(d.getFullYear(), d.getMonth() + 1, 0));
  }

  /** Lijst met datums van `from` t/m `to` (inclusief) */
  function range(from, to) {
    var out = [], cur = from;
    var guard = 0;
    while (cur <= to && guard++ < 1000) {
      out.push(cur);
      cur = addDays(cur, 1);
    }
    return out;
  }

  /** ISO-weeknummer */
  function isoWeek(s) {
    var d = parse(s);
    var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    t.setDate(t.getDate() + 3 - ((t.getDay() + 6) % 7));
    var week1 = new Date(t.getFullYear(), 0, 4);
    return 1 + Math.round(
      ((t - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7
    );
  }

  var DAY_NAMES = ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'];
  var MONTH_NAMES = ['januari', 'februari', 'maart', 'april', 'mei', 'juni',
    'juli', 'augustus', 'september', 'oktober', 'november', 'december'];

  function dayName(s) { return DAY_NAMES[(parse(s).getDay() + 6) % 7]; }
  function monthName(s) { return MONTH_NAMES[parse(s).getMonth()]; }

  function formatDate(s) {
    var d = parse(s);
    return dayName(s) + ' ' + d.getDate() + ' ' + MONTH_NAMES[d.getMonth()] + ' ' + d.getFullYear();
  }

  function formatShort(s) {
    var d = parse(s);
    return d.getDate() + ' ' + MONTH_NAMES[d.getMonth()].slice(0, 3);
  }

  function relativeLabel(s) {
    var t = today();
    if (s === t) return 'Vandaag';
    if (s === addDays(t, -1)) return 'Gisteren';
    if (s === addDays(t, 1)) return 'Morgen';
    return null;
  }

  /* ---------------------------- opslag ---------------------------- */

  function emptyState() {
    return {
      version: 2,
      settings: clone(GD.DEFAULT_SETTINGS),
      settingsTs: 0,
      entries: {},
      // Gewiste dagen onthouden we, anders zet een synchronisatie ze terug.
      tombstones: {},
      // Spiegel van wat de koppeling met Apple Health aanlevert. Alleen lezen:
      // deze kant schrijft er nooit in, dus hij kan ook niets overschrijven.
      voeding: {}
    };

  /**
   * Tijdstempel van een dag: elke wijziging zet hem op nu. Dagen van vóór de
   * synchronisatie krijgen 1, zodat een echt bewerkte versie elders wint.
   */
  function entryTs(date) {
    var e = load().entries[date];
    if (e && typeof e._ts === 'number') return e._ts;
    if (e) return 1;
    var t = load().tombstones[date];
    return typeof t === 'number' ? t : 0;
  }

  function stamp(date, ts) {
    var e = load().entries[date];
    if (e) e._ts = ts === undefined ? Date.now() : ts;
  }

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  var state = null;

  function load() {
    if (state) return state;
    state = emptyState();
    try {
      var raw = global.localStorage.getItem(GD.STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        state = migrate(parsed);
      }
    } catch (e) {
      console.warn('Kon opgeslagen data niet lezen, start leeg.', e);
    }
    return state;
  }

  function migrate(data) {
    var s = emptyState();
    if (data && typeof data === 'object') {
      if (data.settings) {
        Object.keys(s.settings).forEach(function (k) {
          if (k === 'weights') return;
          if (data.settings[k] !== undefined) s.settings[k] = data.settings[k];
        });
        if (data.settings.weights) {
          Object.keys(s.settings.weights).forEach(function (k) {
            var w = data.settings.weights[k];
            if (typeof w === 'number' && isFinite(w) && w >= 0) s.settings.weights[k] = w;
          });
        }
      }
      // Lijsten moeten lijsten blijven, ook als er ooit iets raars binnenkomt.
      ['oefeningen', 'schemas'].forEach(function (k) {
        if (!Array.isArray(s.settings[k])) s.settings[k] = [];
      });
      if (typeof data.settingsTs === 'number') s.settingsTs = data.settingsTs;
      if (data.entries && typeof data.entries === 'object') {
        Object.keys(data.entries).forEach(function (date) {
          if (/^\d{4}-\d{2}-\d{2}$/.test(date)) s.entries[date] = data.entries[date];
        });
      }
      if (data.voeding && typeof data.voeding === 'object') {
        Object.keys(data.voeding).forEach(function (date) {
          var rij = data.voeding[date];
          if (/^\d{4}-\d{2}-\d{2}$/.test(date) && rij && typeof rij === 'object') {
            s.voeding[date] = rij;
          }
        });
      }
      if (data.tombstones && typeof data.tombstones === 'object') {
        Object.keys(data.tombstones).forEach(function (date) {
          if (/^\d{4}-\d{2}-\d{2}$/.test(date) && typeof data.tombstones[date] === 'number') {
            s.tombstones[date] = data.tombstones[date];
          }
        });
      }
    }
    return s;
  }

  var saveTimer = null;
  /* Telt elke wijziging; de oefeningen-historie hangt haar cache hieraan op. */
  var rev = 0;

  function writeNow() {
    if (saveTimer) {
      clearTimeout(saveTimer);
      saveTimer = null;
    }
    if (!state) return;
    try {
      global.localStorage.setItem(GD.STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.error('Opslaan mislukt', e);
      alert('Opslaan mislukt: de opslag van je browser zit vol of staat uit.');
    }
  }

  function save() {
    rev++;
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(writeNow, 120);
  }

  // Op een telefoon kan de app zomaar naar de achtergrond gaan; schrijf dan

  <script>
/* Goal Dashboard - oefeningen, trainingsschema's en progressive overload
 *
 * Per training leg je van elke oefening één regel vast: je beste set. De app
 * zoekt daar de vorige keer bij die je diezelfde oefening deed - niet gisteren,
 * maar de laatste sessie waarin hij voorkomt - en bepaalt of je vooruit bent
 * gegaan. Daaruit volgt automatisch het doel "Progressive overload".
 *
 * Oefeningen kennen twee bijzonderheden:
 * - type 'reps': geen gewicht, alleen herhalingen (pull-ups, leg raises).
 * - perArm: rechts en links tellen apart, elk met een eigen vergelijking.
 */
(function (global) {
  'use strict';

  var GD = global.GD;
  var store = GD.store;

  function num(v) {
    if (v === null || v === undefined || v === '') return null;
    var n = typeof v === 'number' ? v : parseFloat(String(v).replace(',', '.'));
    return isFinite(n) ? n : null;
  }

  function nieuwId(prefix) {
    return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  /* ------------------------------ oefeningen ------------------------------ */

  function oefeningen() {
    var l = store.settings().oefeningen;
    return Array.isArray(l) ? l : [];
  }

  function schemas() {
    var l = store.settings().schemas;
    return Array.isArray(l) ? l : [];
  }

  function bewaarOefeningen(lijst) { store.setSetting('oefeningen', lijst); }
  function bewaarSchemas(lijst) { store.setSetting('schemas', lijst); }

  function byId(oid) {
    var l = oefeningen();
    for (var i = 0; i < l.length; i++) if (l[i].id === oid) return l[i];
    return null;
  }

  function schemaById(sid) {
    var l = schemas();
    for (var i = 0; i < l.length; i++) if (l[i].id === sid) return l[i];
    return null;
  }

  function naam(oid) {
    var o = byId(oid);
    return o ? o.naam : 'Verwijderde oefening';
  }

  function zoekOpNaam(tekst) {
    var n = String(tekst || '').trim().toLowerCase();
    if (!n) return null;
    var l = oefeningen();
    for (var i = 0; i < l.length; i++) {
      if (String(l[i].naam).trim().toLowerCase() === n) return l[i];
    }
    return null;
  }

  /** Maakt een oefening aan, of geeft de bestaande met dezelfde naam terug. */
  function addOefening(tekst, opties) {
    var n = String(tekst || '').trim();
    if (!n) return null;
    var bestaand = zoekOpNaam(n);
    if (bestaand) return bestaand.id;
    var o = {
      id: nieuwId('o'),
      naam: n,
      type: (opties && opties.type) === 'reps' ? 'reps' : 'gewicht',
      perArm: !!(opties && opties.perArm),
      startDatum: null
    };
    var lijst = oefeningen().slice();
    lijst.push(o);
    bewaarOefeningen(lijst);
    return o.id;
  }

  function updateOefening(oid, velden) {
    var lijst = oefeningen().map(function (o) {
      if (o.id !== oid) return o;
      var kopie = JSON.parse(JSON.stringify(o));
      Object.keys(velden).forEach(function (k) { kopie[k] = velden[k]; });
      return kopie;
    });
    bewaarOefeningen(lijst);
  }

  function deleteOefening(oid) {
    bewaarOefeningen(oefeningen().filter(function (o) { return o.id !== oid; }));
    bewaarSchemas(schemas().map(function (s) {
      var kopie = JSON.parse(JSON.stringify(s));
      kopie.oefeningen = (kopie.oefeningen || []).filter(function (id) { return id !== oid; });
      return kopie;
    }));

  /** Vanaf vandaag opnieuw beginnen, bijvoorbeeld na een blessure of deload. */
  function resetStart(oid, datum) {

  /* -------------------------------- schema's ------------------------------ */

  function addSchema(tekst) {

    var lijst = schemas().slice();
    lijst.push(s);

      var kopie = JSON.parse(JSON.stringify(s));
      Object.keys(velden).forEach(function (k) { kopie[k] = velden[k]; });

  function deleteSchema(sid) {
    bewaarSchemas(schemas().filter(function (s) { return s.id !== sid; }));

  function addToSchema(sid, oid) {

    if (!s || !oid) return;
    var lijst = (s.oefeningen || []).slice();
    if (lijst.indexOf(oid) < 0) lijst.push(oid);
    updateSchema(sid, { oefeningen: lijst });

  function removeFromSchema(sid, oid) {
    var s = schemaById(sid);

    updateSchema(sid, {
      oefeningen: (s.oefeningen || []).filter(function (id) { return id !== oid; })

  function moveInSchema(sid, oid, richting) {

        { naam: 'Chestpress machine' },
        { naam: 'Lateral raise', perArm: true },
        { naam: 'Tricep overhead', perArm: true },
        { naam: 'Cable crunch' },
        { naam: 'Leg raises', type: 'reps' }

    },
    {
      naam: 'Pull',
      oefeningen: [
        { naam: 'Pullups', type: 'reps' },
        { naam: 'Seated barbel row' },
        { naam: 'Small lat pulldown' },
        { naam: 'Rows' },
        { naam: 'Bicep curls' },
        { naam: 'Hammer curls' }

    }

  function startschemasToevoegen() {
    var toegevoegd = 0;
    STARTSCHEMAS.forEach(function (sjabloon) {
      var sid = addSchema(sjabloon.naam);
      if (!sid) return;
      toegevoegd++;
      sjabloon.oefeningen.forEach(function (o) {
        addToSchema(sid, addOefening(o.naam, o));
      });
    });
    return toegevoegd;
  }

  /* ------------------------------ dagelijkse invoer ----------------------- */

  /** Rechts en links tellen apart; gewone oefeningen hebben één naamloze kant. */
  function zijden(oef) {
    if (oef && oef.perArm) {
      return [
        { key: 'r', label: 'Rechterarm', kort: 'R' },
        { key: 'l', label: 'Linkerarm', kort: 'L' }

    return [{ key: '', label: '', kort: '' }];

  function dagOefeningen(datum) {
    var e = store.entry(datum);
    var o = e && e.oefeningen;
    return o && typeof o === 'object' ? o : {};
  }

  function dagSchema(datum) {
    var e = store.entry(datum);
    return e && e.schema ? e.schema : null;
  }

  function setDagSchema(datum, sid) {
    store.setField(datum, 'schema', sid || null);
  }

  /**
   * Leest één kant uit. Zonder herhalingen is er niets te vergelijken; een leeg
   * gewicht telt als 0 kg, zodat pull-ups en leg raises gewoon werken.
   */
  function leesZijde(waarde, zijdeKey) {

    var v = zijdeKey ? waarde[zijdeKey] : waarde;
    if (!v || typeof v !== 'object') return null;

  function ruweWaarde(datum, oid, zijdeKey, veld) {

    cacheRev = store.rev();

    zoekOpNaam: zoekOpNaam,
    addOefening: addOefening,
    updateOefening: updateOefening,
    deleteOefening: deleteOefening,

    }

    }

   *
   * Zolang de dag loopt telt een nog niet gehaalde teller niet mee — anders
   * kelderde je dagscore 's ochtends door een doel waar je nog aan bezig bent.
   * Bij afgelopen dagen telt gewoon het deel dat je haalde.
   */
  function meterItem(goal, entry, settings, w, live) {
    var amount = entry ? num(entry[goal.field]) : null;
    var doel = num(settings[goal.doelKey], 0);
    var item = {
      key: goal.key,
      goal: goal,
      value: amount,
      amount: amount,
      doel: doel,
      auto: false,
      option: null,
      weight: w,
      score: null,
      included: false,
      reason: ''
    };

    var frac = null;
    if (amount !== null) {
      frac = doel > 0 ? GD.clamp(amount / doel, 0, 1) : (amount > 0 ? 1 : 0);
    }
    item.frac = frac;

    if (w === 0) {
      item.reason = 'uitgezet';
    } else if (amount === null) {
      if (live) {
        item.reason = 'nog niet ingevuld';
      } else {
        item.score = 0;
        item.included = true;
        item.reason = 'niet ingevuld';
      }
    } else if (live && frac < 1) {
      item.reason = 'nog bezig';
    } else {
      item.score = frac;
      item.included = true;
    }
    return item;
  }

  /**
   * Score van één dag.
   * live=true : nog niet ingevulde doelen tellen niet mee (voor vandaag/toekomst)
   * -> { pct, points, max, items[], hasEntry, trained }
   */
  function scoreDay(date, live) {
    var settings = store.settings();
    var entry = store.entry(date);
    if (live === undefined) live = date >= D.today();

    var gesportGoal = GD.goalByKey('gesport');
    var trainedValue = resolveValue(entry, gesportGoal, settings).value;
    var trained = trainedValue === 'ja';

    var points = 0, max = 0, items = [];

    GD.GOALS.forEach(function (goal) {
      var w = weightOf(goal, settings);

      if (goal.type === 'meter') {
        var mItem = meterItem(goal, entry, settings, w, live);
        if (mItem.included) {
          points += mItem.score * w;
          max += w;
        }
        items.push(mItem);
        return;
      }

      var res = resolveValue(entry, goal, settings);
      var opt = res.value ? optionFor(goal, res.value) : null;
      var item = {
        key: goal.key,
        goal: goal,
        value: res.value,
        auto: res.auto,
        option: opt,
        weight: w,
        score: null,
        included: false,
        reason: ''
      };

      if (w === 0) {
        item.reason = 'uitgezet';
      } else if (goal.onlyIfTrained && !trained) {
        if (trainedValue === 'rustdag') item.reason = 'rustdag';
        else if (trainedValue) item.reason = 'niet getraind';
        else item.reason = live ? 'nog niet ingevuld' : 'niet getraind';
      } else if (!opt) {
        if (live) {
          item.reason = 'nog niet ingevuld';
        } else {
          item.score = 0;
          item.included = true;
          item.reason = 'niet ingevuld';
        }
      } else if (opt.score === null) {
        item.reason = opt.reason || 'rustdag';
      } else {
        item.score = opt.score;
        item.included = true;
      }

      if (item.included) {
        points += item.score * w;
        max += w;
      }
      items.push(item);
    });

    return {
      date: date,
      pct: max > 0 ? (points / max) * 100 : null,
      points: points,
      max: max,
      items: items,
      trained: trained,
      trainedValue: trainedValue,
      restDay: trainedValue === 'rustdag',
      hasEntry: !!entry
    };
  }

  /**
   * Wat er van een dag vaststaat en wat er nog te halen valt.
   *
   * Zonder dit leest een lopende dag te mooi: vul je 's ochtends drie doelen
   * goed in, dan staat de ring op 100% terwijl de dag nog bijna helemaal open
   * ligt. `vloerPct` is je score als de dag nu zou eindigen, `plafondPct` het
   * hoogste dat vandaag nog kan.
   *
   * binnen + kwijt + open = alle punten die deze dag te verdienen waren.
   */
  function dagOverzicht(day) {
    var binnen = 0, kwijt = 0, open = 0;

    day.items.forEach(function (it) {
      var w = it.weight;
      if (!w) return; // gewicht op 0: dit doel telt niet mee

      if (it.goal.type === 'meter') {
        var frac = it.frac === null || it.frac === undefined ? 0 : it.frac;
        binnen += frac * w;
        if (it.reason === 'nog niet ingevuld' || it.reason === 'nog bezig') {
          open += (1 - frac) * w;
        } else {
          kwijt += (1 - frac) * w;
        }
        return;
      }

      if (it.included) {
        binnen += it.score * w;
        kwijt += (1 - it.score) * w;
      } else if (it.reason === 'nog niet ingevuld') {
        open += w;
      }
      // rustdag, niet getraind of een eerste keer: vandaag niet te verdienen
    });

    var totaal = binnen + kwijt + open;
    return {
      binnen: binnen,
      kwijt: kwijt,
      open: open,
      totaal: totaal,
      vloerPct: totaal > 0 ? (binnen / totaal) * 100 : null,
      plafondPct: totaal > 0 ? ((binnen + open) / totaal) * 100 : null,
      livePct: day.pct
    };
  }

  /** Maximaal haalbare punten voor een dag zonder training-afhankelijke doelen */
  function baseMax() {
    var settings = store.settings();
    var m = 0;
    GD.GOALS.forEach(function (g) {
      if (!g.onlyIfTrained) m += weightOf(g, settings);
    });
    return m;
  }

  /**
   * Score over een periode.
   * -> { pct, days[], logged, scored, missing, future, breakdown[], stats }
   */
  function scorePeriod(dates) {
    var settings = store.settings();
    var t = D.today();
    // Dagen van vóór je allereerste invoer zijn geen gemiste dagen: toen
    // gebruikte je het dashboard nog niet.
    var known = store.allDates();
    var firstEver = known.length ? known[0] : null;
    var points = 0, max = 0;
    var days = [];
    var logged = 0, missing = 0, future = 0, scoredDays = 0;
    var bd = {};
    GD.GOALS.forEach(function (g) {
      bd[g.key] = { goal: g, points: 0, max: 0, counts: {}, days: 0, sum: 0, measured: 0, hits: 0 };
      (g.options || []).forEach(function (o) { bd[g.key].counts[o.v] = 0; });
      bd[g.key].counts['leeg'] = 0;
    });

    dates.forEach(function (date) {
      if (date > t) {
        future++;
        days.push({ date: date, pct: null, state: 'future' });
        return;
      }
      var e = store.entry(date);
      if (e) {
        logged++;
        var d = scoreDay(date, date === t);
        if (d.max > 0) {
          points += d.points;
          max += d.max;
          scoredDays++;
        }
        // Vandaag laten we in de balkjes en de kalender dezelfde tussenstand
        // zien als op de dagpagina. Zonder dat staat het balkje van vandaag op
        // 100% omdat je ontbijt goed was, terwijl de dag zelf 24% meldt.
        // De optelling hierboven blijft wel op de ingevulde doelen gebaseerd,
        // anders zou één halve dag je hele weekcijfer omlaag trekken.
        days.push({
          date: date,
          pct: date === t ? dagOverzicht(d).vloerPct : d.pct,
          state: 'logged',
          day: d
        });
        d.items.forEach(function (it) {
          var b = bd[it.key];
          if (it.included) {
            b.points += it.score * it.weight;
            b.max += it.weight;
            b.days++;
          }
          if (it.goal.type === 'meter') {
            if (it.amount === null) b.counts['leeg']++;
            else {
              b.sum += it.amount;
              b.measured++;
              if (it.frac >= 1) b.hits++;
            }
          } else if (it.value) {
            b.counts[it.value] = (b.counts[it.value] || 0) + 1;
          } else {
            b.counts['leeg']++;
          }
        });
      } else {
        missing++;
        var counted = settings.countMissingAsZero && date < t &&
          firstEver !== null && date >= firstEver;
        if (counted) max += baseMax();
        days.push({ date: date, pct: counted ? 0 : null, state: counted ? 'missing0' : 'missing' });
        GD.GOALS.forEach(function (g) { bd[g.key].counts['leeg']++; });
      }
    });

    var breakdown = GD.GOALS.map(function (g) {
      var b = bd[g.key];
      return {
        key: g.key,
        goal: g,
        pct: b.max > 0 ? (b.points / b.max) * 100 : null,
        days: b.days,
        counts: b.counts,
        avg: b.measured ? b.sum / b.measured : null,
        measured: b.measured,
        hits: b.hits
      };
    });

    return {
      pct: max > 0 ? (points / max) * 100 : null,
      points: points,
      max: max,
      days: days,
      logged: logged,
      missing: missing,
      future: future,
      scoredDays: scoredDays,
      breakdown: breakdown,
      stats: periodStats(dates, days)
    };
  }

  function periodStats(dates, days) {
    var t = D.today();
    var weights = [], trainDays = 0, restDays = 0, kcal = [], prot = [], water = [];
    dates.forEach(function (date) {
      if (date > t) return;
      var e = store.entry(date);
      if (!e) return;
      var w = num(e.gewicht);
      if (w !== null) weights.push({ date: date, w: w });
      var d = scoreDay(date, date === t);
      if (d.trained) trainDays++;
      if (d.restDay) restDays++;
      var k = num(e.kcal); if (k !== null) kcal.push(k);
      var p = num(e.eiwitGram); if (p !== null) prot.push(p);
      var wa = num(e.waterMl); if (wa !== null) water.push(wa);
    });

    function avg(arr) {
      if (!arr.length) return null;
      return arr.reduce(function (a, b) { return a + b; }, 0) / arr.length;
    }

    return {
      weights: weights,
      weightStart: weights.length ? weights[0].w : null,
      weightEnd: weights.length ? weights[weights.length - 1].w : null,
      weightDelta: weights.length > 1 ? weights[weights.length - 1].w - weights[0].w : null,
      weightAvg: avg(weights.map(function (x) { return x.w; })),
      trainDays: trainDays,
      restDays: restDays,
      kcalAvg: avg(kcal),
      kcalDays: kcal.length,
      proteinAvg: avg(prot),
      proteinDays: prot.length,
      waterAvg: avg(water),
      waterDays: water.length,
      goodDays: days.filter(function (d) {
        return d.pct !== null && d.pct >= store.settings().goedeDagDrempel;
      }).length
    };
  }

  /** Gemiddeld gewicht over een reeks datums (dagen in de toekomst tellen niet mee). */
  function weightAvg(dates) {
    var sum = 0, n = 0, t = D.today();
    dates.forEach(function (date) {
      if (date > t) return;
      var e = store.entry(date);
      if (!e) return;
      var w = num(e.gewicht);
      if (w === null) return;
      sum += w;
      n++;
    });
    return { avg: n ? sum / n : null, count: n };
  }

  /**
   * Vergelijkt het gemiddelde gewicht van twee periodes en scoort dat tegen
   * je gewichtsdoel (aankomen, afvallen of op gewicht blijven).
   *
   * Bewust los van de dagscore: gewicht is een uitkomst, geen gedrag dat je
   * op één dag kunt "halen".
   */
  function weightTrend(dates, prevDates, perWeek) {
    var s = store.settings();
    var richting = s.gewichtRichting || 'uit';
    var cur = weightAvg(dates);
    var prev = weightAvg(prevDates);
    var tempoPerWeek = Math.abs(num(s.gewichtTempo, 0.25));
    // Bij een maandvergelijking hoort een navenant groter verschil.
    var weeks = perWeek === undefined ? 1 : perWeek;
    var doelDelta = tempoPerWeek * weeks;

    var out = {
      richting: richting,
      avg: cur.avg,
      count: cur.count,
      prevAvg: prev.avg,
      prevCount: prev.count,
      delta: null,
      doelDelta: doelDelta,
      pct: null,
      note: ''
    };

    if (richting === 'uit') return out;
    if (cur.avg === null || prev.avg === null) {
      out.note = 'Nog te weinig metingen om te vergelijken.';
      return out;
    }

    var delta = cur.avg - prev.avg;
    out.delta = delta;

    if (richting === 'aankomen') {
      out.pct = doelDelta > 0
        ? GD.clamp(delta / doelDelta, 0, 1) * 100
        : (delta > 0 ? 100 : 0);
      if (delta <= 0) out.note = 'Je zit gelijk of lager dan de vorige periode — dat is de verkeerde kant op voor spieropbouw.';
      else if (doelDelta > 0 && delta > doelDelta * 2) out.note = 'Ruim boven je tempo. Snel aankomen betekent meestal ook meer vetaanzet.';
    } else if (richting === 'afvallen') {
      out.pct = doelDelta > 0
        ? GD.clamp(-delta / doelDelta, 0, 1) * 100
        : (delta < 0 ? 100 : 0);
      if (delta >= 0) out.note = 'Je zit gelijk of hoger dan de vorige periode.';
      else if (doelDelta > 0 && -delta > doelDelta * 2) out.note = 'Sneller dan je tempo — let op je spierbehoud.';
    } else if (richting === 'behouden') {
      var marge = doelDelta > 0 ? doelDelta : 0.25;
      out.pct = GD.clamp(1 - Math.abs(delta) / marge, 0, 1) * 100;
      if (Math.abs(delta) > marge) out.note = 'Buiten je marge van ' + marge.toFixed(2) + ' kg.';
    }

    if (cur.count < 3 || prev.count < 3) {
      out.note = (out.note ? out.note + ' ' : '') +
        'Let op: gebaseerd op weinig metingen, dus gevoelig voor toeval. Dagelijks wegen geeft een betrouwbaarder beeld.';
    }
    return out;
  }

  /** Gemiddeld gewicht over zeven dagen tot en met `datum`, `terug` weken eerder. */
  function gewichtWeek(datum, terug) {
    var eind = D.addDays(datum, -7 * (terug || 0));
    return weightAvg(D.range(D.addDays(eind, -6), eind));
  }

  function kgTekst(n) {
    var v = Math.round(n * 100) / 100;
    return (v > 0 ? '+' : (v < 0 ? '−' : '')) + Math.abs(v).toFixed(2).replace('.', ',') + ' kg';
  }

  /**
   * Hoe verhoudt een gewichtsverschil zich tot je tempo?
   * -> { status: 'verkeerd'|'traag'|'op-schema'|'snel', pct, ratio }
   *
   * De grenzen zijn ruim (een halve tot anderhalve keer je tempo telt als op
   * schema), want een weekgemiddelde schommelt al gauw een ons of twee door
   * vocht en darminhoud.
   */
  function gewichtStatus(delta, richting, tempo) {
    if (richting === 'behouden') {
      var marge = tempo > 0 ? tempo : 0.25;
      var binnen = Math.abs(delta) <= marge;
      return { status: binnen ? 'op-schema' : 'verkeerd', pct: binnen ? 100 : 20, ratio: null };
    }
    // Voor afvallen draaien we het teken om; daarna is de rekensom gelijk.
    var gewenst = richting === 'aankomen' ? delta : -delta;
    var ratio = tempo > 0 ? gewenst / tempo : (gewenst > 0 ? 1 : 0);
    if (ratio <= 0) return { status: 'verkeerd', pct: 0, ratio: ratio };
    if (ratio < 0.5) return { status: 'traag', pct: 45, ratio: ratio };
    if (ratio <= 1.5) return { status: 'op-schema', pct: 100, ratio: ratio };
    return { status: 'snel', pct: 50, ratio: ratio };
  }

  /**
   * Eén regel over je gewicht: de laatste zeven dagen tegenover de zeven dagen
   * daarvoor, afgezet tegen je tempo.
   *
   * Twee dingen zijn hier bewust zo gebouwd, allebei omdat gewicht van dag tot
   * dag makkelijk een kilo op en neer gaat door vocht, zout en darminhoud:
   *
   * - Er wordt met gemiddelden gerekend, nooit met de laatste weging.
   * - Een afwijking wordt pas als waarschuwing gebracht als hij twee weken op
   *   rij te zien is. Daarvoor wordt dezelfde vergelijking een week eerder
   *   nog eens gemaakt (dag −13 t/m −7 tegen −20 t/m −14). Zegt die iets
   *   anders, dan blijft het bij een kale constatering.
   *
   * Het venster rolt mee met de dag in plaats van op hele kalenderweken te
   * zitten, zodat de melding ook op een dinsdag ergens op slaat.
   */
  function gewichtMelding(datum) {
    var s = store.settings();
    var richting = s.gewichtRichting || 'uit';
    var tempo = Math.abs(num(s.gewichtTempo, 0.25));
    var out = {
      richting: richting, status: 'uit', delta: null, doelDelta: tempo,
      pct: null, tekst: '', metingen: 0, vorigeMetingen: 0, avg: null, vorigeAvg: null,
      bevestigd: false, waarschuwing: false,
      vorigeStatus: null, vorigeDelta: null, eerdereMetingen: 0, eerdereAvg: null
    };
    if (richting === 'uit') return out;

    var nu = gewichtWeek(datum, 0);
    var vorig = gewichtWeek(datum, 1);
    var eerder = gewichtWeek(datum, 2);
    out.metingen = nu.count;
    out.vorigeMetingen = vorig.count;
    out.eerdereMetingen = eerder.count;
    out.avg = nu.avg;
    out.vorigeAvg = vorig.avg;
    out.eerdereAvg = eerder.avg;

    if (nu.count === 0 || vorig.count === 0) {
      out.status = 'te-weinig';
      out.tekst = nu.count === 0
        ? 'Weeg je een paar keer per week, dan zie je hier of je op schema ligt.'
        : 'Nog geen gewicht in de zeven dagen daarvóór, dus er valt nog niets te vergelijken.';
      return out;
    }

    var delta = nu.avg - vorig.avg;
    out.delta = delta;
    var oordeel = gewichtStatus(delta, richting, tempo);
    out.status = oordeel.status;

    // Dezelfde vergelijking een week terug. Pas als die hetzelfde oordeel geeft
    // is het een trend en geen schommeling.
    if (eerder.avg !== null) {
      out.vorigeDelta = vorig.avg - eerder.avg;
      out.vorigeStatus = gewichtStatus(out.vorigeDelta, richting, tempo).status;
    }
    out.bevestigd = out.vorigeStatus === oordeel.status;
    out.waarschuwing = oordeel.status !== 'op-schema' && out.bevestigd;
    // Kleur alleen bij goed nieuws of bij een bevestigde afwijking; een losse
    // week blijft grijs, anders schrik je van ruis.
    out.pct = (oordeel.status === 'op-schema' || out.waarschuwing) ? oordeel.pct : null;

    var doel = (richting === 'aankomen' ? '+' : '−') + tempo.toFixed(2).replace('.', ',');
    var marge = tempo > 0 ? tempo : 0.25;
    var kop = kgTekst(delta) + ' deze week — ';

    if (oordeel.status === 'op-schema') {
      out.tekst = kop + (richting === 'behouden'
        ? 'binnen je marge van ' + marge.toFixed(2).replace('.', ',') + ' kg.'
        : 'op schema (doel ' + doel + ' per week).');
    } else {
      if (richting === 'behouden') {
        out.tekst = kop + 'buiten je marge van ' + marge.toFixed(2).replace('.', ',') + ' kg.';
      } else if (oordeel.status === 'verkeerd') {
        out.tekst = kop + 'je komt niet ' + (richting === 'aankomen' ? 'aan' : 'af') +
          ', terwijl je dat wel wilt (doel ' + doel + ' per week).';
      } else if (oordeel.status === 'traag') {
        out.tekst = kop + 'trager dan je tempo van ' + doel + ' per week.';
      } else {
        out.tekst = kop + 'sneller dan je tempo van ' + doel + ' per week.';
      }

      if (out.waarschuwing) {
        out.tekst += ' Twee weken op rij, dus dit is geen schommeling meer.' +
          (oordeel.status !== 'snel' ? '' : richting === 'aankomen'
            ? ' Zo komt er vooral vet bij.'
            : ' Let op je spierbehoud.');
      } else if (out.vorigeStatus) {
        out.tekst += ' De week ervóór was dat nog niet zo, dus dit kan schommeling zijn — ' +
          'pas als het volgende week weer zo is, valt er iets bij te stellen.';
      } else {
        out.tekst += ' Eén week zegt nog weinig. Staat het volgende week weer zo, dan is het ' +
          'een trend.';
      }
    }

    if (nu.count < 3 || vorig.count < 3) {
      out.tekst += ' Gebaseerd op ' + nu.count + ' en ' + vorig.count +
        ' weegmoment' + (nu.count === 1 && vorig.count === 1 ? '' : 'en') + ', dus gevoelig voor toeval.';
    }
    return out;
  }

  /** Huidige reeks goede dagen, geteld vanaf vandaag (of gisteren) terug. */
  function currentStreak() {
    var settings = store.settings();
    var drempel = num(settings.goedeDagDrempel, 70);
    var t = D.today();
    var cursor = t;

    // Vandaag telt alleen mee als hij de drempel al haalt; anders start bij gisteren.
    var todayScore = store.entry(t) ? scoreDay(t, true).pct : null;
    if (todayScore === null || todayScore < drempel) cursor = D.addDays(t, -1);

    var streak = 0, guard = 0;
    while (guard++ < 3650) {
      var e = store.entry(cursor);
      if (!e) break;
      var d = scoreDay(cursor, false);
      if (d.pct === null || d.pct < drempel) break;
      streak++;
      cursor = D.addDays(cursor, -1);
    }
    return streak;
  }

  /** Langste reeks ooit */
  function bestStreak() {
    var drempel = num(store.settings().goedeDagDrempel, 70);
    var dates = store.allDates();
    var best = 0, run = 0, prev = null;
    dates.forEach(function (date) {
      var d = scoreDay(date, false);
      var good = d.pct !== null && d.pct >= drempel;
      if (good && prev && D.addDays(prev, 1) === date) run++;
      else if (good) run = 1;
      else run = 0;
      if (run > best) best = run;
      prev = date;
    });
    return best;
  }

  GD.score = {
    scoreDay: scoreDay,
    scorePeriod: scorePeriod,
    dagOverzicht: dagOverzicht,
    resolveValue: resolveValue,
    weightOf: weightOf,
    baseMax: baseMax,
    gewichtStatus: gewichtStatus,
    gewichtMelding: gewichtMelding,
    currentStreak: currentStreak,
    bestStreak: bestStreak,
    weightAvg: weightAvg,
    weightTrend: weightTrend,
    num: num,
    optionFor: optionFor
  };
})(window);

  <script>
/* Goal Dashboard - kleine SVG-grafieken (geen externe libraries) */
(function (global) {

  var GD = global.GD;
  var D = GD.date;

  /* Alles wat de gebruiker intypt gaat hier doorheen voordat het in de pagina
     komt. Ook de enkele quote hoort erbij: de app zet attributen nu tussen
     dubbele quotes, maar dat mag later wijzigen zonder gat te slaan. */
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    if (tot !== null && tot > value + 0.5) {

        ' stroke-linecap="round" stroke-dasharray="' + dashTot + ' ' + (c - dashTot) + '"' +

      '" role="img" aria-label="' + esc(omschrijving) + '">' +
      '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="var(--track)" stroke-width="' + stroke + '"/>' +
      open +
      '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + color + '"' +
      ' stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + dash + ' ' + (c - dash) + '"' +
      ' transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')"/>' +
      '<text x="' + size / 2 + '" y="' + (size / 2 + size * 0.075) + '" text-anchor="middle" class="ring-pct" fill="' + color + '"' +

      GD.scoreColor(has ? pct : null) + '"></div></div>';
  }

  /**
   * Lijngrafiek voor gewicht.
   * points: [{date, w}], doel: number|null
   */
  function weightChart(points, doel) {
    var W = 640, H = 200, padL = 44, padR = 12, padT = 16, padB = 26;
    if (!points || points.length === 0) {
      return '<p class="empty">Nog geen gewicht ingevuld in deze periode.</p>';
    }
    if (points.length === 1) {
      return '<p class="empty">Eén meting: <strong>' + points[0].w.toFixed(1) + ' kg</strong> op ' +
        esc(D.formatShort(points[0].date)) + '. Vul meer dagen in voor een grafiek.</p>';

    if (doel !== null && doel !== undefined) vals.push(doel);

    min -= span * 0.15;

    var t1 = D.parse(points[points.length - 1].date).getTime();
    var tSpan = (t1 - t0) || 1;

    function x(date) {
      return padL + ((D.parse(date).getTime() - t0) / tSpan) * (W - padL - padR);
    }

      return padT + (1 - (v - min) / (max - min)) * (H - padT - padB);

      return (i === 0 ? 'M' : 'L') + x(p.date).toFixed(1) + ' ' + y(p.w).toFixed(1);

      return '<circle cx="' + x(p.date).toFixed(1) + '" cy="' + y(p.w).toFixed(1) +

      return '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '" class="wc-grid"/>' +
        '<text x="' + (padL - 8) + '" y="' + (y(v) + 4).toFixed(1) + '" text-anchor="end" class="wc-axis">' + v.toFixed(1) + '</text>';

        '" class="wc-goal"/><text x="' + (W - padR) + '" y="' + (y(doel) - 5).toFixed(1) +

      '<text x="' + (W - padR) + '" y="' + (H - 6) + '" text-anchor="end" class="wc-axis">' +
      esc(D.formatShort(points[points.length - 1].date)) + '</text>';

    return '<svg class="weight-chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Gewichtsverloop">' +

  /**
   * Lijngrafiek met één of twee reeksen, voor het verloop van een oefening.

   * week tot week, en dat verdwijnt in het niets als je vanaf nul tekent.

    opts = opts || {};

    var gevuld = reeksen.filter(function (r) { return r.punten && r.punten.length; });
    var alle = [];
    gevuld.forEach(function (r) {
      r.punten.forEach(function (p) { alle.push(p); });
    });

    if (!alle.length) return '<p class="empty">' + esc(opts.leeg || 'Nog niets ingevuld.') + '</p>';
    if (alle.length === 1) {
      return '<p class="empty">Eén sessie: <strong>' + esc(alle[0].label) + '</strong> op ' +
        esc(D.formatShort(alle[0].datum)) + '. Vul deze oefening nog een keer in, dan tekent de app een lijn.</p>';
    }

    var vals = alle.map(function (p) { return p.v; });
    var min = Math.min.apply(null, vals);
    var max = Math.max.apply(null, vals);
    var span = max - min || Math.max(1, max * 0.1);
    min -= span * 0.15;
    max += span * 0.15;

    var datums = alle.map(function (p) { return D.parse(p.datum).getTime(); });
    var t0 = Math.min.apply(null, datums);
    var t1 = Math.max.apply(null, datums);
    var tSpan = (t1 - t0) || 1;

    function x(datum) {
      return padL + ((D.parse(datum).getTime() - t0) / tSpan) * (W - padL - padR);
    }
    function y(v) {
      return padT + (1 - (v - min) / (max - min)) * (H - padT - padB);
    }

    var lijnen = gevuld.map(function (r, i) {
      var pad = r.punten.map(function (p, j) {
        return (j === 0 ? 'M' : 'L') + x(p.datum).toFixed(1) + ' ' + y(p.v).toFixed(1);
      }).join(' ');
      var stippen = r.punten.map(function (p) {
        return '<circle cx="' + x(p.datum).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '"' +
          ' r="' + (p.piek ? 5 : 3) + '" class="lc-dot' + (p.piek ? ' lc-pr' : '') + '">' +
          '<title>' + esc(D.formatShort(p.datum) + ': ' + p.label + (p.piek ? ' (beste)' : '')) +
          '</title></circle>';

        (r.punten.length > 1 ? '<path d="' + pad + '" class="lc-line"/>' : '') +
        stippen + '</g>';
    }).join('');

    var grid = gridVals.map(function (v) {
      return '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '" class="wc-grid"/>' +
        '<text x="' + (padL - 8) + '" y="' + (y(v) + 4).toFixed(1) + '" text-anchor="end" class="wc-axis">' +
        esc(afronden(v)) + '</text>';
    }).join('');

    var eersteDatum = alle.reduce(function (a, p) { return p.datum < a ? p.datum : a; }, alle[0].datum);
    var laatsteDatum = alle.reduce(function (a, p) { return p.datum > a ? p.datum : a; }, alle[0].datum);
    var xLabels = '<text x="' + padL + '" y="' + (H - 6) + '" class="wc-axis">' + esc(D.formatShort(eersteDatum)) + '</text>' +
      '<text x="' + (W - padR) + '" y="' + (H - 6) + '" text-anchor="end" class="wc-axis">' +
      esc(D.formatShort(laatsteDatum)) + '</text>';

    var uitleg = gevuld.length > 1
      ? '<div class="lc-legenda">' + gevuld.map(function (r, i) {
        return '<span class="lc-merk lc-serie-' + i + '"></span>' + esc(r.naam);
      }).join('') + '</div>'
      : '';

    return '<svg class="lijn-grafiek" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' +
      esc(opts.omschrijving || 'Verloop van deze oefening') + '">' +
      grid + lijnen + xLabels +
      '</svg>' + uitleg;
  }

  /** Astekst zonder overbodige decimaal: 47,5 blijft 47,5 en 12 blijft 12. */
  function afronden(v) {

  /** Staafjes per dag (weekoverzicht) */

      var has = d.pct !== null;
      var h = has ? Math.max(3, GD.clamp(d.pct, 0, 100)) : 3;
      var color = has ? GD.scoreColor(d.pct) : 'var(--track)';
      var title = D.formatDate(d.date) + ' — ' + (has ? Math.round(d.pct) + '%' : 'niet ingevuld');
      return '<button class="daybar" data-date="' + d.date + '" title="' + esc(title) + '" ' + (onClickAttr || '') + '>' +
        '<span class="daybar-track"><span class="daybar-fill" style="height:' + h + '%;background:' + color + '"></span></span>' +
        '<span class="daybar-label">' + esc(D.dayName(d.date)) + '</span>' +
        '<span class="daybar-val" style="color:' + (has ? color : 'var(--muted)') + '">' + (has ? Math.round(d.pct) : '–') + '</span>' +
        '</button>';

  /** Maandkalender met kleurvlakken */
  function calendar(anchorDate, days) {
    var byDate = {};
    days.forEach(function (d) { byDate[d.date] = d; });

    var first = D.startOfMonth(anchorDate);
    var last = D.endOfMonth(anchorDate);
    var lead = (D.parse(first).getDay() + 6) % 7;
    var t = D.today();

    var cells = '';
    for (var i = 0; i < lead; i++) cells += '<div class="cal-cell cal-empty"></div>';

    D.range(first, last).forEach(function (date) {
      var d = byDate[date];
      var pct = d ? d.pct : null;
      var has = pct !== null && pct !== undefined;
      var cls = 'cal-cell';
      if (date === t) cls += ' cal-today';
      if (date > t) cls += ' cal-future';
      if (d && d.state === 'missing0') cls += ' cal-missing';
      var bg = has ? GD.scoreColor(pct) : 'transparent';
      var fg = has ? GD.textOn(pct) : 'var(--muted)';
      var title = D.formatDate(date) + ' — ' +
        (has ? Math.round(pct) + '%' : (date > t ? 'toekomst' : 'niet ingevuld'));
      cells += '<button class="' + cls + '" data-date="' + date + '" title="' + esc(title) + '"' +
        ' style="background:' + bg + ';color:' + fg + '">' +
        '<span class="cal-day">' + D.parse(date).getDate() + '</span>' +
        '<span class="cal-pct">' + (has ? Math.round(pct) + '%' : '') + '</span>' +
        '</button>';
    });

    var head = D.DAY_NAMES.map(function (n) {
      return '<div class="cal-head">' + n + '</div>';
    }).join('');

    return '<div class="calendar">' + head + cells + '</div>';
  }

  /** Kleurenlegenda 0 -> 100 */
  function legend() {
    var stops = [0, 25, 50, 75, 100].map(function (p) {
      return GD.scoreColor(p) + ' ' + p + '%';
    }).join(', ');
    return '<div class="legend"><span>0%</span>' +
      '<span class="legend-bar" style="background:linear-gradient(90deg,' + stops + ')"></span>' +
      '<span>100%</span></div>';
  }

  GD.charts = {
    ring: ring,
    bar: bar,
    weightChart: weightChart,
    lijnGrafiek: lijnGrafiek,
    dayBars: dayBars,
    calendar: calendar,
    legend: legend,
    esc: esc
  };
})(window);

  <script>
/* Goal Dashboard - weekafsluiting: wat ging er goed, en klopt je eten met je gewicht? */
(function (global) {
  'use strict';

  var GD = global.GD;
  var store = GD.store;
  var D = GD.date;
  var S = GD.score;

  /* Eén kilo lichaamsgewicht komt ruwweg overeen met 7700 kcal. Een vuistregel,
     geen natuurwet: hij is goed genoeg om te zien of je bij moet sturen, niet
     om op de kilo nauwkeurig te rekenen. */
  var KCAL_PER_KG = 7700;

  /* Het rapport gaat over maandag t/m vrijdag: het weekend is bewust de vrije
     ruimte en hoort er niet in. Maar het verschijnt pas op zaterdag, want de
     voeding van vrijdag komt 's avonds laat uit Apple Health binnen — op
     vrijdagavond zou de week dus nog niet compleet zijn. */
  var LAATSTE_DAG = 4;      // 0 = maandag, 4 = vrijdag
  var TOT_UUR = 12;         // zondag nog tot 12:00, als je zaterdag gemist hebt

  /** Maandag t/m vrijdag van de week waarin `datum` valt. */
  function dagen(datum) {
    var start = D.startOfWeek(datum);
    return D.range(start, D.addDays(start, LAATSTE_DAG));
  }

  /** De maandag van de week; gebruikt om te onthouden welke afsluiting je zag. */
  function weekSleutel(datum) {
    return D.startOfWeek(datum);
  }

  /** Staat de afsluiting nu op de dagpagina? Zaterdag de hele dag, zondag tot 12:00. */
  function vensterOpen(nu) {
    var d = nu || new Date();
    var dag = d.getDay();
    if (dag === 6) return true;
    if (dag === 0) return d.getHours() < TOT_UUR;
    return false;
  }

  function gezien(datum) {
    return store.settings().weekafsluitingGezien === weekSleutel(datum);
  }

  function markeerGezien(datum) {
    store.setSetting('weekafsluitingGezien', weekSleutel(datum));
  }

  function afgerond(n, stap) {
    return Math.round(n / stap) * stap;
  }

  /**
   * Hoeveel kcal per dag je bij zou moeten stellen om je tempo te halen.
   * Positief = meer eten, negatief = minder. Ruim afgerond, en begrensd:
   * een sprong van meer dan 500 kcal per dag is nooit een verstandig advies
   * op basis van één week meten.
   */
  function bijstelling(delta, richting, tempo) {
    var doelDelta = richting === 'aankomen' ? tempo : (richting === 'afvallen' ? -tempo : 0);
    var gat = doelDelta - delta;
    var kcal = afgerond((gat * KCAL_PER_KG) / 7, 50);
    return GD.clamp(kcal, -500, 500);

  /**
   * De kern van de afsluiting: klopt wat je at met wat de weegschaal deed?

   * Twee losse cijfers zeggen weinig — "2400 kcal" is pas een probleem als je

    var richting = s.gewichtRichting || 'uit';
    var doel = S.num(s.calorieDoel, 0);
    var uit = {
      status: 'onbekend', kop: '', tekst: '', bijstellen: 0, nieuwDoel: null,
      kcalGem: kcalGem, kcalDagen: kcalDagen
    };

    if (richting === 'uit') {
      uit.status = 'geen-doel';
      uit.kop = 'Geen gewichtsdoel ingesteld';
      uit.tekst = 'Zet bij Instellingen een gewichtsdoel en tempo, dan kijk ik hier na of je eten ' +
        'en je gewicht met elkaar kloppen.';
      return uit;
    }

    if (kcalDagen < 3) {
      uit.status = 'te-weinig-kcal';
      uit.kop = 'Te weinig calorieën ingevuld';
      uit.tekst = 'Je vulde je calorieën ' + kcalDagen + ' van de ' + geweest + ' dag' +
        (geweest === 1 ? '' : 'en') + ' in. Met minder dan drie dagen kan ik niet zien of het aan ' +
        'je eten ligt — dan blijft het gokken.' +
        (gewicht.delta === null ? '' : ' Je gewicht deed deze week ' + kgTekst(gewicht.delta) + '.');
      return uit;

        'én vorige week kan ik niet zeggen of dat te veel of te weinig was. Weeg jezelf een paar ' +
        'ochtenden per week, steeds op hetzelfde moment.';

    var kcal = bijstelling(gewicht.delta, richting, tempo);
    uit.bijstellen = kcal;

    var marge = Math.max(100, doel * 0.05);
    var onderDoel = doel > 0 && kcalGem < doel - marge;
    var bovenDoel = doel > 0 && kcalGem > doel + marge;
    var gemTekst = Math.round(kcalGem) + ' kcal per dag';
    var doelTekst = Math.round(doel) + ' kcal';

    if (gewicht.status === 'op-schema') {
      uit.status = 'op-schema';
      uit.kop = 'Eten en gewicht kloppen met elkaar';
      uit.tekst = 'Je zat op ' + gemTekst + ' en je gewicht ging ' + kgTekst(gewicht.delta) +
        ' — precies het tempo dat je wilde. Verander niets aan wat je eet.';
      // De weegschaal doet het goed terwijl het doel op rood staat: dan klopt
      // niet je eten, maar het doel. Anders zou de app hier "verander niets"
      // zeggen en tegelijk je caloriedoel de hele week afkeuren.
      if (doel > 0 && !doelGehaald(kcalGem, s)) {
        uit.nieuwDoel = afgerond(kcalGem, 10);
        uit.tekst += ' Je eigen doel van ' + doelTekst + ' haalde je daarbij niet, terwijl je ' +

       staat de schaal weer anders en verzet je het terug. Dus eerst kijken of
       dezelfde afwijking er twee weken op rij staat. */
    if (!gewicht.bevestigd) {
      uit.status = 'afwachten';
      uit.bijstellen = 0;
      uit.kop = 'Eén week — nog even aankijken';
      uit.tekst = 'Je at gemiddeld ' + gemTekst + ' en je gewicht deed ' +
        kgTekst(gewicht.delta) + ', ' + (teLangzaam ? 'minder' : 'meer') + ' dan je ' +
        (richting === 'behouden' ? 'marge' : 'tempo') + '. ' +
        (gewicht.vorigeStatus
          ? 'Maar de week ervóór deed je gewicht iets anders, dus dit kan schommeling zijn.'
          : 'Er is nog geen week ervóór om dit naast te leggen.') +
        (doel > 0
          ? ' Je doel van ' + doelTekst + ' blijft daarom staan. Zegt volgende week hetzelfde, ' +
            'dan wordt het advies ongeveer ' + afgerond(doel + kcal, 10) + ' kcal per dag.'

    if (teLangzaam) {

        ? 'Je komt te langzaam aan'

      if (onderDoel) {
        uit.tekst = 'Je at gemiddeld ' + gemTekst + ', onder je doel van ' + doelTekst +
          ', en je gewicht deed ' + kgTekst(gewicht.delta) + '. Dat past bij elkaar: er ging te ' +
          'weinig in. Haal eerst je eigen doel — dat scheelt al ongeveer ' +
          Math.round(doel - kcalGem) + ' kcal per dag.';
      } else {
        uit.nieuwDoel = afgerond(doel + kcal, 10);
        uit.tekst = 'Je haalde je doel van ' + doelTekst + ' wél (gemiddeld ' + gemTekst +
          '), maar je gewicht deed ' + kgTekst(gewicht.delta) + '. Dan is je doel zelf te laag ' +
          'voor wat je verbruikt. Zet het op ongeveer ' + uit.nieuwDoel + ' kcal en kijk over ' +
          'twee weken opnieuw.';
      }
    } else {
      uit.kop = richting === 'aankomen'
        ? 'Je komt sneller aan dan je tempo'
        : 'Je valt sneller af dan je tempo';
      if (bovenDoel) {
        uit.tekst = 'Je at gemiddeld ' + gemTekst + ', boven je doel van ' + doelTekst +
          ', en je gewicht deed ' + kgTekst(gewicht.delta) + '. ' +
          (richting === 'aankomen'
            ? 'Sneller aankomen is vooral vet, geen extra spier. '
            : 'Te snel afvallen kost spiermassa. ') +
          'Terug naar je doel is waarschijnlijk genoeg.';
      } else {
        uit.nieuwDoel = afgerond(doel + kcal, 10);
        uit.tekst = 'Je zat met ' + gemTekst + ' rond je doel van ' + doelTekst +
          ', maar je gewicht deed ' + kgTekst(gewicht.delta) + '. Dan is je doel te hoog ' +
          'voor wat je verbruikt: ongeveer ' + uit.nieuwDoel + ' kcal past beter bij je tempo.';
      }
    }
    return uit;
  }

  /** Haalde je je caloriedoel? Zelfde regel als de app op de dag gebruikt. */
  function doelGehaald(kcal, s) {
    var doel = S.num(s.calorieDoel, 0);
    if (!doel) return true;
    if (s.calorieRichting === 'min') return kcal >= doel;
    if (s.calorieRichting === 'rond') return Math.abs(kcal - doel) <= S.num(s.calorieMarge, 0);
    return kcal <= doel;
  }

  function kgTekst(n) {
    var v = Math.round(n * 100) / 100;
    return (v > 0 ? '+' : (v < 0 ? '−' : '')) + Math.abs(v).toFixed(2).replace('.', ',') + ' kg';
  }

  function eiwitAdvies(gem, dagen, geweest, s) {
    var doel = S.num(s.eiwitDoel, 0);
    if (!dagen) {
      return { status: 'onbekend', tekst: 'Je vulde deze week geen eiwitten in.' };
    }
    if (dagen < 3) {
      return {
        status: 'onbekend',
        tekst: 'Eiwitten maar ' + dagen + ' van de ' + geweest + ' dagen ingevuld — te weinig om ' +
          'iets over te zeggen.'
      };
    }
    if (doel > 0 && gem < doel * 0.9) {
      return {
        status: 'onder',
        tekst: 'Gemiddeld ' + Math.round(gem) + ' g eiwit tegen een doel van ' + Math.round(doel) +
          ' g. Dat is ' + Math.round(doel - gem) + ' g per dag te weinig — juist bij spieropbouw ' +
          'is dat het cijfer dat telt.'
      };
    }
    return {
      status: 'goed',
      tekst: 'Gemiddeld ' + Math.round(gem) + ' g eiwit per dag, doel ' + Math.round(doel) + ' g. Prima.'
    };
  }

  /**
   * Alles van één week op een rij. `datum` mag elke dag in die week zijn.
   */
  function maak(datum) {
    var s = store.settings();
    var vandaag = D.today();
    var reeks = dagen(datum);
    var geweest = reeks.filter(function (d) { return d <= vandaag; });
    var period = S.scorePeriod(reeks);
    var st = period.stats;

    /* Gewicht: deze werkweek tegen dezelfde dagen een week eerder — en die week
       nog eens tegen de week dáárvoor. Eén week weegschaal zegt te weinig om je
       eten op bij te stellen; pas als beide vergelijkingen hetzelfde zeggen is
       het een trend. */
    var nu = S.weightAvg(reeks);
    var vorig = S.weightAvg(reeks.map(function (d) { return D.addDays(d, -7); }));
    var eerder = S.weightAvg(reeks.map(function (d) { return D.addDays(d, -14); }));
    var tempo = Math.abs(S.num(s.gewichtTempo, 0.25));
    var richting = s.gewichtRichting || 'uit';
    var gewicht = {
      richting: richting,
      avg: nu.avg, metingen: nu.count,
      vorigeAvg: vorig.avg, vorigeMetingen: vorig.count,
      eerdereAvg: eerder.avg, eerdereMetingen: eerder.count,
      delta: null, doelDelta: tempo, status: 'te-weinig', tekst: '',
      bevestigd: false, vorigeStatus: null, vorigeDelta: null
    };
    if (richting !== 'uit' && nu.avg !== null && vorig.avg !== null) {
      gewicht.delta = nu.avg - vorig.avg;
      var oordeel = S.gewichtStatus(gewicht.delta, richting, tempo);
      gewicht.status = oordeel.status;
      gewicht.pct = oordeel.pct;
      if (eerder.avg !== null) {
        gewicht.vorigeDelta = vorig.avg - eerder.avg;
        gewicht.vorigeStatus = S.gewichtStatus(gewicht.vorigeDelta, richting, tempo).status;
      }
      gewicht.bevestigd = gewicht.vorigeStatus === oordeel.status;
      gewicht.tekst = kgTekst(gewicht.delta) + ' tegenover vorige week (' +
        nu.count + ' en ' + vorig.count + ' weegmomenten).';
    }

    /* Beste en zwakste doel: alleen doelen die deze week echt meetelden. */
    var meetellend = period.breakdown.filter(function (b) {
      return b.pct !== null && S.weightOf(b.goal, s) > 0 && b.days > 0;
    });
    var gesorteerd = meetellend.slice().sort(function (a, b) { return b.pct - a.pct; });

    return {
      weekStart: reeks[0],
      dagen: reeks,
      geweest: geweest.length,
      label: 'week ' + D.isoWeek(reeks[0]),
      periode: D.formatShort(reeks[0]) + ' – ' + D.formatShort(reeks[reeks.length - 1]),
      period: period,
      pct: period.pct,
      ingevuld: period.logged,
      goedeDagen: st.goodDays,
      trainDagen: st.trainDays,
      rustDagen: st.restDays,
      beste: gesorteerd.length ? gesorteerd[0] : null,
      zwakste: gesorteerd.length > 1 ? gesorteerd[gesorteerd.length - 1] : null,
      gewicht: gewicht,
      eten: eetAdvies(gewicht, st.kcalAvg, st.kcalDays, geweest.length, s),
      eiwit: eiwitAdvies(st.proteinAvg, st.proteinDays, geweest.length, s),
      kcalDagen: st.kcalDays,
      kcalGem: st.kcalAvg,
      eiwitDagen: st.proteinDays,
      eiwitGem: st.proteinAvg
    };
  }

  GD.review = {
    dagen: dagen,
    weekSleutel: weekSleutel,
    vensterOpen: vensterOpen,
    gezien: gezien,
    markeerGezien: markeerGezien,
    bijstelling: bijstelling,
    kgTekst: kgTekst,
    maak: maak,
    KCAL_PER_KG: KCAL_PER_KG
  };
})(window);

  </script>
  <script>
/* Goal Dashboard - calorieën en eiwitten uit Apple Health
 *
 * MyFitnessPal (of Lifesum, Cronometer, …) schrijft je voeding naar Apple
 * Health. Een Shortcut op je telefoon leest daar de dagtotalen uit en zet ze in
 * de tabel `voeding` van je eigen Supabase-project. Dit bestand haalt die
 * waarden naar je dagen toe.
 *
 * Waarom een aparte tabel en niet gewoon in `dagen`? Omdat synchroniseren een
 * dagrij in zijn geheel vervangt: een koppeling die alleen calorieën kent zou
 * dan je water, je vinkjes en je oefeningen van die dag wissen.
 *
 * Wie zelf een getal intikt, wint. Dat onthouden we per veld in `kcalBron` en
 * `eiwitGramBron`, zodat de volgende synchronisatie je eigen invoer niet
 * terugdraait.
 */
(function (global) {
  'use strict';

  var GD = global.GD;
  var store = GD.store;

  var VELDEN = [
    { veld: 'kcal', bronVeld: 'kcalBron', kolom: 'kcal', label: 'Calorieën', eenheid: 'kcal' },
    { veld: 'eiwitGram', bronVeld: 'eiwitGramBron', kolom: 'eiwit', label: 'Eiwitten', eenheid: 'g' }
  ];

  function veldInfo(veld) {
    for (var i = 0; i < VELDEN.length; i++) if (VELDEN[i].veld === veld) return VELDEN[i];
    return null;
  }

  function getal(v) {
    var n = GD.score.num(v);
    return n === null ? null : Math.round(n);
  }

  /** Wat Health voor deze dag doorgaf, of null. */
  function health(datum, veld) {
    var rij = store.voeding(datum);
    var info = veldInfo(veld);
    if (!rij || !info) return null;
    return getal(rij[info.kolom]);
  }

  /**
   * Alles wat binnenkwam toepassen op je dagen.
   * -> aantal gewijzigde velden
   */
  function toepassen() {
    if (!store.settings().voedingSync) return 0;
    var alles = store.alleVoeding();
    var gewijzigd = 0;

    Object.keys(alles).forEach(function (datum) {
      VELDEN.forEach(function (info) {
        var waarde = getal(alles[datum][info.kolom]);
        if (waarde === null) return;

        var e = store.entry(datum) || {};
        var bron = e[info.bronVeld];
        if (bron === 'hand') return;              // jij hebt hier zelf iets van gevonden

        var huidig = getal(e[info.veld]);
        if (huidig !== null && bron !== 'health') return; // stond er al vóór de koppeling
        if (huidig === waarde && bron === 'health') return;

        store.setField(datum, info.veld, waarde);
        store.setField(datum, info.bronVeld, 'health');
        gewijzigd++;
      });
    });
    return gewijzigd;
  }

  /**
   * Waar komt de waarde van dit veld vandaan, en wijkt Health daarvan af?
   * -> { aan, health, bron, waarde, afwijkend }
   */
  function status(datum, veld) {
    var info = veldInfo(veld);
    var aan = !!store.settings().voedingSync;
    var e = store.entry(datum) || {};
    var uitHealth = aan ? health(datum, veld) : null;
    var waarde = info ? getal(e[info.veld]) : null;
    return {
      aan: aan,
      health: uitHealth,
      bron: info ? (e[info.bronVeld] || null) : null,
      waarde: waarde,
      afwijkend: uitHealth !== null && waarde !== uitHealth
    };
  }

  /** De waarde uit Health alsnog overnemen voor deze dag. */
  function overnemen(datum, veld) {
    var info = veldInfo(veld);
    var waarde = health(datum, veld);
    if (!info || waarde === null) return false;
    store.setField(datum, info.veld, waarde);
    store.setField(datum, info.bronVeld, 'health');
    return true;
  }

  /** Zelf ingetikt: vanaf nu blijft Health van dit veld af. */
  function handmatig(datum, veld) {
    var info = veldInfo(veld);
    if (info) store.setField(datum, info.bronVeld, 'hand');
  }
