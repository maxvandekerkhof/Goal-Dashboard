<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <!--
    De app laadt niets van buiten en praat alleen met je eigen Supabase-project.
    Dat leggen we hier vast, zodat de browser vreemde scripts weigert en er ook
    bij een fout in de code geen gegevens naar een ander adres kunnen.
    'unsafe-inline' bij style is nodig voor de style="width:..%"-attributen in
    de balken. Gebruik je een eigen domein voor Supabase, vul dat dan aan bij
    connect-src.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co https://*.supabase.in; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Dagelijks, wekelijks en maandelijks overzicht van je sport- en voedingsdoelen, met een gekleurd percentage van donkerrood naar donkergroen.">
  <meta name="theme-color" content="#0a0c10">
  <title>Goal Dashboard — sport &amp; voeding</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Goal">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><rect width='20' height='20' fill='%230a0c10'/><g fill='none' stroke='%2300e5a0' stroke-width='1.8'><circle cx='10' cy='10' r='6.4'/><circle cx='10' cy='10' r='2.9'/></g><circle cx='10' cy='10' r='.9' fill='%2300e5a0'/></svg>">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10" /> <circle cx="12" cy="12" r="6" /> <circle cx="12" cy="12" r="2" /></svg>
        </span>
        <div>
          <h1>Goal Dashboard</h1>
          <p class="brand-sub">Sport &amp; voeding</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="btn-sync" class="btn btn-icon" hidden title="Nu synchroniseren" aria-label="Nu synchroniseren"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /> <path d="M21 3v5h-5" /> <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /> <path d="M8 16H3v5" /></svg></button>
        <button id="btn-theme" class="btn btn-icon" title="Licht/donker wisselen" aria-label="Licht of donker thema"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 2v2" /> <path d="M14.837 16.385a6 6 0 1 1-7.223-7.222c.624-.147.97.66.715 1.248a4 4 0 0 0 5.26 5.259c.589-.255 1.396.09 1.248.715" /> <path d="M16 12a4 4 0 0 0-4-4" /> <path d="m19 5-1.256 1.256" /> <path d="M20 12h2" /></svg></button>
      </div>
    </div>

    <nav class="tabs" role="tablist" aria-label="Periode">
      <button class="tab tab-active" data-view="dag" role="tab" aria-selected="true"><svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10" /> <path d="M12 6v6l4 2" /></svg>Dag</button>
      <button class="tab" data-view="week" role="tab" aria-selected="false"><svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 3v16a2 2 0 0 0 2 2h16" /> <path d="M18 17V9" /> <path d="M13 17V5" /> <path d="M8 17v-3" /></svg>Week</button>
      <button class="tab" data-view="maand" role="tab" aria-selected="false"><svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 2v3" /> <path d="M16 2v3" /> <rect x="3" y="3" width="18" height="18" rx="2" /> <path d="M3 9h18" /> <path d="M8 13h.01" /> <path d="M12 13h.01" /> <path d="M16 13h.01" /> <path d="M8 17h.01" /> <path d="M12 17h.01" /> <path d="M16 17h.01" /></svg>Maand</button>
      <button class="tab" data-view="instellingen" role="tab" aria-selected="false"><svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" /> <circle cx="12" cy="12" r="3" /></svg>Instellingen</button>
    </nav>

    <div class="period-nav" id="period-nav">
      <button class="btn btn-icon" data-nav="prev" aria-label="Vorige periode"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 18-6-6 6-6" /></svg></button>
      <span id="period-label" class="period-label">—</span>
      <button class="btn btn-icon" data-nav="next" aria-label="Volgende periode"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 18 6-6-6-6" /></svg></button>
      <button class="btn btn-ghost btn-sm" id="btn-today" data-nav="today">Vandaag</button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <footer class="footer">
    <p>Je gegevens staan in deze browser, en met synchroniseren aan ook in je eigen Supabase-project. Maak af en toe een back-up via <strong>Instellingen&nbsp;→&nbsp;Je data</strong>.</p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <input type="file" id="file-json" accept=".json,application/json" hidden>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/vangnet.js"></script>
  <script src="js/lifts.js"></script>
  <script src="js/score.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/review.js"></script>
  <script src="js/voeding.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
