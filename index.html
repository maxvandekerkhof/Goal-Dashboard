<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <!--
    De app laadt niets van buiten en praat alleen met je eigen Supabase-project.
    Dat leggen we hier vast, zodat de browser vreemde scripts weigert en er ook
    bij een fout in de code geen gegevens naar een ander adres kunnen.
    'unsafe-inline' bij style is nodig voor de style="width:..%"-attributen in
    de balken. Gebruik je een eigen domein voor Supabase, vul dat dan aan bij
    connect-src.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co https://*.supabase.in; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Dagelijks, wekelijks en maandelijks overzicht van je sport- en voedingsdoelen, met een gekleurd percentage van donkerrood naar donkergroen.">
  <meta name="theme-color" content="#0c0e11">
  <title>Goal Dashboard — sport &amp; voeding</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><rect width='20' height='20' fill='%230c0e11'/><g fill='none' stroke='%23e8ebef' stroke-width='1.6'><circle cx='10' cy='10' r='6.4'/><circle cx='10' cy='10' r='2.9'/></g><circle cx='10' cy='10' r='.9' fill='%23e8ebef'/></svg>">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" focusable="false">
            <circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r="3.2"/>
            <circle cx="10" cy="10" r=".9" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <div>
          <h1>Goal Dashboard</h1>
          <p class="brand-sub">Sport &amp; voeding</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="btn-sync" class="btn btn-icon" hidden title="Nu synchroniseren" aria-label="Nu synchroniseren">⟳</button>
        <button id="btn-theme" class="btn btn-icon" title="Licht/donker wisselen" aria-label="Licht of donker thema">◐</button>
      </div>
    </div>

    <nav class="tabs" role="tablist" aria-label="Periode">
      <button class="tab tab-active" data-view="dag" role="tab" aria-selected="true">Dag</button>
      <button class="tab" data-view="week" role="tab" aria-selected="false">Week</button>
      <button class="tab" data-view="maand" role="tab" aria-selected="false">Maand</button>
      <button class="tab" data-view="instellingen" role="tab" aria-selected="false">Instellingen</button>
    </nav>

    <div class="period-nav" id="period-nav">
      <button class="btn btn-icon" data-nav="prev" aria-label="Vorige periode">‹</button>
      <span id="period-label" class="period-label">—</span>
      <button class="btn btn-icon" data-nav="next" aria-label="Volgende periode">›</button>
      <button class="btn btn-ghost btn-sm" id="btn-today" data-nav="today">Vandaag</button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <footer class="footer">
    <p>Je gegevens blijven in deze browser staan. Maak af en toe een back-up via <strong>Instellingen&nbsp;→&nbsp;Je data</strong>.</p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <input type="file" id="file-json" accept=".json,application/json" hidden>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/lifts.js"></script>
  <script src="js/score.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/review.js"></script>
  <script src="js/voeding.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
